}

/* ---------- GRAFIK & SIMULASI ---------- */
function rGrafik(){
  const g=UI.grafik;
  const tabs=`<div class="seg" style="grid-template-columns:repeat(3,1fr)">${[['stok','Stok'],['bobot','Sebaran bobot'],['sim','Simulasi']].map(([k,l])=>`<button data-act="gTab" data-v="${k}" aria-selected="${g===k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(g==='stok'){
    const X=stokCalc();if(!X)body='<p class="muted">Data stok belum terbaca.</p>';else{
      const j=UI.gJenis&&X.by[UI.gJenis]?UI.gJenis:X.items[0].nama,b=X.by[j];
      const tx=S.stok.tx.filter(t=>t.jenis===j&&t.tgl).sort((a,c)=>a.tgl.localeCompare(c.tgl));
      let run=b.awal;const byDay={};tx.forEach(t=>{run+=t.trx==='Masuk'?t.kg:-t.kg;byDay[t.tgl]={x:pd(t.tgl).getTime(),y:run}});
      const pts=Object.values(byDay).map(p=>({...p,label:nf(p.y,1)+' '+satuan(b)}));
      if(pts.length)pts.push({x:today0().getTime(),y:b.stok,label:nf(b.stok,1)+' '+satuan(b),note:'hari ini'});
      const proj=b.need>0&&b.stok>0?[{x:today0().getTime(),y:b.stok},{x:addD(today0(),Math.min(60,b.stok/b.need)).getTime(),y:Math.max(0,b.stok-b.need*Math.min(60,b.stok/b.need)),label:'perkiraan habis',note:fd(addD(today0(),b.stok/b.need))}]:[];
      body=`<div class="kchips" style="margin-bottom:12px">${X.items.map(x=>`<button data-act="gJenis" data-v="${esc(x.nama)}" aria-pressed="${x.nama===j}">${esc(x.nama)}</button>`).join('')}</div>
      <div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Stok ${esc(j)}</h3><span class="small muted">${nf(b.stok,1)} ${satuan(b)} · ${b.hari!=null?'cukup ±'+nf(b.hari,0)+' hari':''}</span></div>
      ${svgLine([{name:'Stok',color:'var(--accent)',pts},{name:'Perkiraan habis',color:'var(--orange)',dash:true,w:1.6,pts:proj}],{id:'gs',h:230,y0:0,label:'Stok '+j})}</div>`}
  }else if(g==='bobot'){
    const act=S.domba.filter(isAktif),bins=[];const lo=Math.floor(Math.min(S.g.bbAwal,...act.map(s=>s.bobot))/2.5)*2.5,hi=Math.ceil(Math.max(S.g.bbPanen,...act.map(s=>s.bobot))/2.5)*2.5;
    for(let v=lo;v<hi;v+=2.5){const m=act.filter(s=>s.bobot>=v&&s.bobot<v+2.5);bins.push({k:nf(v,1)+'–'+nf(v+2.5,1)+' kg',v:m.length,lab:m.length+' ekor',c:v+2.5>S.g.bbPanen?'var(--gold)':'var(--accent)',det:m.map(s=>`<button class="linkbtn" data-act="domba" data-v="${esc(s.tag)}">${esc(s.tag)}</button> ${nf(s.bobot,1)} kg (${esc(s.posisi)})`).join(' · ')})}
    body=`<div class="panel"><h3>Sebaran bobot domba aktif</h3><p class="small muted" style="margin-top:0">${act.length} ekor. Emas = sudah mendekati/melewati bobot panen ${S.g.bbPanen} kg. Ketuk untuk melihat siapa saja.</p>${svgBars(bins,{id:'gw'})}</div>`;
  }else body=rSimulasi();
  return `${syncBanner()}<section class="blk"><h2>Grafik & simulasi</h2><p class="lead">Data langsung dari Google Sheets. ADG dan biaya pakan per bulan ada di tab Laporan.</p>${tabs}${body}</section>`;
}
function simDefault(){const o=S.opsi[S.aktif];return {ekor:S.domba.filter(isAktif).length||S.kawanan,hA:S.b.ampas.h,hK:S.b['k'+o.pk].h,hO:S.b.odot.h,hM:S.b.mol.h,r:o.r,pk:o.pk,porsi:100,anggaran:S.g.anggaran}}
const SIMFMT={ekor:x=>x+' ekor',hA:x=>rp(+x),hK:x=>rp(+x),hO:x=>rp(+x),hM:x=>rp(+x),r:x=>nf(+x,2)+' : 1',porsi:x=>x+'%',anggaran:x=>rp(+x)};
function simHitung(){
  const v=UI.sim,o=S.opsi[S.aktif],base=calc(o);
  const bak=JSON.stringify({b:S.b,g:S.g});
  let sim;
  try{S.b.ampas.h=v.hA;S.b['k'+v.pk].h=v.hK;S.b.odot.h=v.hO;S.b.mol.h=v.hM;S.g.anggaran=v.anggaran;
    const o2={...o,r:v.r,pk:v.pk,sil:o.sil.map(x=>x*v.porsi/100),od:o.od.map(x=>x*v.porsi/100),kt:o.kt.map(x=>x*v.porsi/100)};sim=calc(o2)}
  finally{const b=JSON.parse(bak);S.b=b.b;S.g=b.g}
  return {v,base,sim};
}
function rSimulasi(){
  if(!UI.sim)UI.sim=simDefault();const v=UI.sim;
  const sl=(k,l,min,max,step,fmt)=>`<div class="sl"><label for="sim-${k}"><span>${l}</span><b id="simv-${k}">${fmt(v[k])}</b></label><input type="range" id="sim-${k}" data-sim="${k}" min="${min}" max="${max}" step="${step}" value="${v[k]}"></div>`;
  return `<div class="two"><div class="panel">
    <h3>Geser untuk mencoba</h3>
    ${sl('ekor','Jumlah ekor',1,Math.max(200,v.ekor),1,SIMFMT.ekor)}
    ${sl('hA','Harga ampas tahu /kg',500,2500,50,SIMFMT.hA)}
    ${sl('hK','Harga konsentrat /kg',2500,7000,100,SIMFMT.hK)}
    ${sl('hO','Harga odot /kg',100,1000,25,SIMFMT.hO)}
    ${sl('hM','Harga molases /kg',2000,8000,100,SIMFMT.hM)}
    ${sl('r','Rasio ampas : konsentrat',1,6,0.25,SIMFMT.r)}
    ${sl('porsi','Porsi pakan dari rencana',70,130,5,SIMFMT.porsi)}
    ${sl('anggaran','Anggaran /ekor/hari',2000,6000,100,SIMFMT.anggaran)}
    <div class="field" style="margin-top:10px"><label class="lbl" for="sim-pk">Protein konsentrat</label><select id="sim-pk" data-simsel="pk">${[14,16,18,20].map(p=>`<option value="${p}" ${+v.pk===p?'selected':''}>PK ${p}%</option>`).join('')}</select></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="simReset">Kembalikan ke data sheet</button></div>
  </div>
  <div id="simout">${rSimHasil()}</div></div>`;
}
function rSimHasil(){
  const {v,base,sim}=simHitung();
  const d=(a,b,inv,f=rp)=>{const x=a-b;if(Math.abs(x)<1e-9)return '<span class="muted">sama</span>';const good=inv?x<0:x>0;return `<span style="color:var(--${good?'ok':'bad'})">${x>0?'+':'−'}${f(Math.abs(x)).replace('−','')}</span>`};
  const row=(l,a,b,f,inv)=>`<tr><td class="l">${l}</td><td><b>${f(a)}</b></td><td>${d(a,b,inv,f)}</td><td class="muted">${f(b)}</td></tr>`;
  const n0=x=>nf(x,0),n1=x=>nf(x,1),n2=x=>nf(x,2),g0=x=>nf(x,0)+' g',pct=x=>pc(x,0);
  const totBln=sim.avg.cost*30*v.ekor,totBln0=base.avg.cost*30*v.ekor;
  return `  <div style="display:grid;gap:14px;align-content:start">
    <div class="kpis">
      <div class="kpi"><div class="lbl">Biaya /ekor/hari</div><div class="v" style="color:var(--${sim.avg.cost<=v.anggaran?'ok':'bad'})">${rp(sim.avg.cost)}</div><div class="s">${d(sim.avg.cost,base.avg.cost,true)} vs sekarang</div></div>
      <div class="kpi"><div class="lbl">Prediksi ADG</div><div class="v" style="color:var(--${sim.avg.adg>=sim.targetADG?'ok':'warn'})">${nf(sim.avg.adg,0)}<small> g</small></div><div class="s">${d(sim.avg.adg,base.avg.adg,false,g0)} · target ${nf(sim.targetADG,0)}</div></div>
      <div class="kpi"><div class="lbl">Biaya kawanan /bulan</div><div class="v" style="font-size:22px">${rp(totBln)}</div><div class="s">${v.ekor} ekor · ${d(totBln,totBln0,true)}</div></div>
      <div class="kpi"><div class="lbl">Biaya /kg bobot</div><div class="v" style="font-size:22px">${rp(sim.costPerKg)}</div><div class="s">${d(sim.costPerKg,base.costPerKg,true)}</div></div>
    </div>
    <div class="tw"><table class="t"><thead><tr><th>Rata-rata 6 bulan</th><th>Simulasi</th><th>Beda</th><th>Sekarang</th></tr></thead><tbody>
      ${row('Biaya pakan /ekor/hari',sim.avg.cost,base.avg.cost,rp,true)}
      ${row('Total 6 bulan /ekor',sim.tot.cost,base.tot.cost,rp,true)}
      ${row('Selisih vs anggaran 6 bln',v.anggaran*S.g.hari-sim.tot.cost,S.g.anggaran*S.g.hari-base.tot.cost,rp,false)}
      ${row('Prediksi ADG (g/hari)',sim.avg.adg,base.avg.adg,n0,false)}
      ${row('BK terpenuhi',sim.avg.bkPct,base.avg.bkPct,pct,false)}
      ${row('PK ransum (% BK)',sim.avg.pkPct,base.avg.pkPct,x=>pc(x,1),false)}
      ${row('Ca : P',sim.avg.caP,base.avg.caP,n2,false)}
      ${row('Hijauan (% BK)',sim.avg.odShare,base.avg.odShare,pct,false)}
      ${row('Harga silase /kg',sim.c.price,base.c.price,rp,true)}
    </tbody></table></div>
    ${sim.avg.bkPct<.95?`<div class="verdict warn"><b>Bahan kering kurang (${pc(sim.avg.bkPct,0)})</b><div>Porsi ini membuat domba kekurangan pakan; ADG nyata bisa lebih rendah dari prediksi.</div></div>`:''}
    ${sim.avg.caP<1.6?`<div class="verdict warn"><b>Ca : P ${nf(sim.avg.caP,2)}</b><div>Di bawah 1,6 — risiko batu saluran kemih pada jantan.</div></div>`:''}
    ${sim.avg.odShare<.5?`<div class="verdict warn"><b>Hijauan hanya ${pc(sim.avg.odShare,0)} dari BK</b><div>Risiko asidosis/kembung naik.</div></div>`:''}
    <p class="note">Simulasi hanya di layar ini dan tidak mengubah Google Sheets. Untuk menerapkan, ubah harga/rasio di file Kalkulator.</p>
  </div>`;
}

/* ============ APP ============ */
const TABS={beranda:rBeranda,peta:rPeta,grafik:rGrafik,pakan:rPakan,stok:rStok,analisis:rAnalisis,silase:rSilase,catat:rCatat,mitigasi:rMitigasi,ransum:rRansum};
function render(){try{ROOT().dataset.kdtab=S.ui.tab;renderInner()}catch(e){console.error(e);ERR((e&&e.message||e)+' @render '+S.ui.tab)}}
function renderInner(){
  const root=ROOT();if(!root||root.hidden)return;
  root.querySelectorAll('#kd-tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.ui.tab?'true':'false'));
  paintPill();
  const fo=document.activeElement&&document.activeElement.id;
  MAIN().innerHTML=READY?(TABS[S.ui.tab]||rPakan)():`<div class="loader"><div class="spin"></div><div>Memuat data dari Google Sheets…</div></div>`;
  if(READY)tagLinks(MAIN());
  if(UI.sheet)renderSheet();
  if(S.ui.tab==='catat'&&READY)applyFilter();
  if(S.ui.tab==='analisis'&&READY&&!LP.list)muatDaftarLaporan();
  if(fo){const el=document.getElementById(fo);if(el&&el.focus)el.focus({preventScroll:true})}
}
function tagLinks(root){if(!root)return;const set=new Set(S.domba.map(s=>s.tag));root.querySelectorAll('.tg,td.mono').forEach(el=>{if(el.closest('[data-act]'))return;const t=el.textContent.trim();if(set.has(t)){el.dataset.act='domba';el.dataset.v=t;el.classList.add('taglink');el.setAttribute('role','button');el.tabIndex=0}})}
function toast(t){O.toast(t)}
ROOT().addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.lg){AUTH[el.dataset.lg]=el.value;if(el.dataset.lg==='nm'){AUTH.err='';const p=document.getElementById('lgPin');if(p)p.focus()}return}
  if(el.dataset.ui){const [a,b]=el.dataset.ui.split('.');UI[a][b]=el.value;return}
  if(el.dataset.simsel){UI.sim[el.dataset.simsel]=+el.value;const o=document.getElementById('simout');if(o)o.innerHTML=rSimHasil();return}
  if(el.dataset.sim)return;
  if(el.dataset.an){AN[el.dataset.an]=el.value;render();return}
  if(el.dataset.w!=null||el.dataset.q)return;
  if(el.dataset.cs){const pth=el.dataset.cs;setCT(pth,el.type==='checkbox'?el.checked:el.dataset.num?+el.value:el.value);
    if(pth==='sb.ampas'||pth==='sb.opsi')sbRecalc();if(pth==='pk.hari')pkFill();
    if(el.dataset.csr||el.tagName==='SELECT'||el.type==='checkbox')render();return}
  if(el.dataset.ct){CT[el.dataset.ct]=el.value;if(el.dataset.ctr)render();return}
  if(el.dataset.cek){const c=cekGet();c[el.dataset.cek]=el.checked;cekSet(c);render();return}
  if(el.dataset.act==='wadah'){if(el.value){S.sil.wadahKg=+el.value;save();render()}return}
  const k=el.dataset.k;if(!k)return;
  let v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='number'||el.dataset.type==='num'){v=parseFloat(String(el.value).replace(',','.'));if(!isFinite(v))v=0;if(el.dataset.pct)v=v/100}
  else v=el.value;
  set(k,v);save();render();
});
ROOT().addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab'){if(UI.sheet)UI.sheet=null;S.ui.tab=v;save();render();renderSheet();window.scrollTo({top:0});return}
  if(a==='closeSheet'){closeSheet();return}
  if(a==='menu'){openSheet({type:'menu'});return}
  if(a==='tabSheet'){UI.sheet=null;renderSheet();S.ui.tab=v;save();render();window.scrollTo({top:0});return}
  if(a==='domba'){e.preventDefault();UI.sheet=null;renderSheet();O.openDetail(v);return}
  if(a==='kandang'){UI.pindah={tag:'',ke:v};openSheet({type:'kandang',k:v});return}
  if(a==='tip'){UI.tip=UI.tip===v?null:v;if(b.closest('#sheet'))renderSheet();else render();return}
  if(a==='petaMode'){UI.petaMode=v;render();return}
  if(a==='pindahkan'){pindahkan();return}
  if(a==='profTimbang'){UI.sheet=null;renderSheet();CT.seg='timbang';CT.q=v;CT.kdg='';S.ui.tab='catat';save();render();window.scrollTo({top:0});setTimeout(()=>{const i=document.getElementById('w-'+v);if(i)i.focus()},50);return}
  if(a==='profKondisi'){UI.sheet=null;renderSheet();O.goInput('kondisi',v);return}
  if(a==='goCatat'&&v==='kondisi'){O.goInput('kondisi','');return}
  if(a==='goCatat'){CT.seg=v;S.ui.tab='catat';save();render();window.scrollTo({top:0});return}
  if(a==='goPdf'){AN.sub='bulanan';S.ui.tab='analisis';save();render();window.scrollTo({top:0});return}
  if(a==='awasi'){AN.sub='awasi';S.ui.tab='analisis';save();render();window.scrollTo({top:0});return}
  if(a==='gTab'){UI.grafik=v;UI.tip=null;render();return}
  if(a==='gJenis'){UI.gJenis=v;UI.tip=null;render();return}
  if(a==='simReset'){UI.sim=simDefault();render();return}
  if(a==='syncNow'){syncNow();return}
  if(a==='saveW'){saveW();return}
  if(a==='seg'){CT.seg=v;render();return}
  if(a==='anSub'){AN.sub=v;render();return}
  if(a==='buatPdf'){buatPdf();return}
  if(a==='anBatch'){AN.batch=v;render();return}
  if(a==='anKondisi'){O.goInput('kondisi',v);return}
  if(a==='sk'){CT.sk=v;render();return}
  if(a==='goStok'){CT.seg='pakan';CT.sk=v;S.ui.tab='catat';save();render();window.scrollTo({top:0});return}
  if(a==='silToStok'){const oi=S.sil.opsi<0?-1:S.sil.opsi;CT.sb={opsi:oi,ampas:S.sil.ampas,v:{},paksa:false,ket:''};sbRecalc();CT.seg='pakan';CT.sk='silase';CT.kTgl=S.sil.tgl||todayISO();S.ui.tab='catat';save();render();window.scrollTo({top:0});return}
  if(a==='sbAll'){const X=stokCalc();CT.sb.ampas=X&&X.by[NM().ampas]?Math.max(0,r1(X.by[NM().ampas].stok)):'';sbRecalc();render();return}
  if(a==='pkFill'){pkFill();render();return}
  if(a==='blKet'){CT.bl.ket=v;render();return}
  if(a==='saveS'){saveS();return}
  if(a==='setupMaster'){setupMaster();return}
  if(a==='kdg'){CT.kdg=v||'';document.querySelectorAll('.kchips button').forEach(x=>x.setAttribute('aria-pressed',String((x.dataset.v||'')===CT.kdg)));applyFilter();return}
  if(a==='ket'){CT.kKet=CT.kKet?CT.kKet+', '+v:v;render();return}
  if(a==='setAktif'){S.aktif=+v;toast('Ransum aktif: '+S.opsi[+v].nama)}
  else if(a==='edit')S.ui.edit=+v;
  else if(a==='addSheep')S.domba.push({tag:'Baru-'+(S.domba.length+1),masuk:todayISO(),jenis:'Jantan',bAwal:20,pemilik:'',kAwal:'Karantina',posisi:'Karantina',timbang:todayISO(),bobot:20,status:'Sehat',keluar:''});
  else if(a==='delSheep')S.domba.splice(+v,1);
  else if(a==='addPalung')S.palung.push(['P-Baru','','']);
  else if(a==='delPalung')S.palung.splice(+v,1);
  else if(a==='resetKual'){S.kual={};S.sil.ph=''}
  else if(a==='resetKondisi'){['kembung','tdkMakan','diare','batuk','mata','pincang','luka','bibir','lepuh'].forEach(k=>S.kondisi[k]=0)}
  else if(a==='import'){const msg=doImport(document.getElementById('imp').value);save();render();const m=document.getElementById('imp-msg');if(m)m.textContent=msg;return}
  else if(a==='askReset')S.ui.confirmReset=true;
  else if(a==='cancelReset')S.ui.confirmReset=false;
  else return;
  save();render();
});

function frame(){
  const root=ROOT();
  root.innerHTML='<div class="kd-tabs" id="kd-tabs" role="tablist">'+TABN.map(t=>`<button type="button" role="tab" data-act="tab" data-v="${t[0]}">${esc(t[1])}</button>`).join('')+'</div><div id="kd-bar"></div><div id="kd-main"></div>';
}
let TIMER=null;
return {
  show:function(){
    if(!ROOT().querySelector('#kd-main'))frame();
    render();
    if(!READY||Date.now()-(S.sync.last||0)>120000)loadData();
    if(!TIMER)TIMER=setInterval(()=>{if(!ROOT().hidden&&document.visibilityState==='visible'&&S.ui.tab!=='catat'&&!CT.busyW)loadData()},10*60e3);
  },
  goto:function(tab,seg){if(!ROOT().querySelector('#kd-main'))frame();if(TABS[tab])S.ui.tab=tab;if(seg)CT.seg=seg;save();render();window.scrollTo(0,0)},
  reset:function(){READY=false;S.sync.last=0;if(ROOT())ROOT().innerHTML=''}
};

});

/** Grafik rata-rata per kandang (domba aktif): pilih Bobot / Kenaikan harian / Jumlah. Warna per blok. */
function kandangCard(list) {
  var m = S.kdm || 'bobot';
  var meta = { bobot: { t: 'Rata-rata bobot (kg)', f: function (v) { return nf1.format(v) + ' kg'; }, k: 'bobot' },
               adg: { t: 'Rata-rata kenaikan (kg/hari)', f: function (v) { return nf3.format(v); }, k: 'adg' },
               aktif: { t: 'Jumlah domba aktif', f: function (v) { return nf0.format(v) + ' ekor'; }, k: 'aktif' } }[m];
  var rows = (list || []).filter(function (x) { return x.aktif > 0; });
  var h = '<div class="card"><h3>Rata-rata per kandang (aktif)</h3>' +
    '<div class="seg"><button type="button" data-kdm="bobot"' + (m === 'bobot' ? ' class="on"' : '') + '>Bobot</button><button type="button" data-kdm="adg"' + (m === 'adg' ? ' class="on"' : '') + '>Naik/hari</button><button type="button" data-kdm="aktif"' + (m === 'aktif' ? ' class="on"' : '') + '>Jumlah</button></div>';
  if (!rows.length) return h + '<p class="muted small">Belum ada domba aktif di kandang.</p></div>';
  var vals = rows.map(function (x) { return x[meta.k]; }).filter(function (v) { return v != null; });
  var mx = Math.max.apply(null, vals.concat([0.0001]));
  var tot = 0, n = 0; rows.forEach(function (x) { if (x[meta.k] != null) { tot += x[meta.k] * (m === 'aktif' ? 1 : x.aktif); n += (m === 'aktif' ? 1 : x.aktif); } });
  var rata = n ? tot / n : null;
  h += '<div class="muted small" style="margin:0 0 8px">' + meta.t + (rata != null ? ' · ' + (m === 'aktif' ? 'rata-rata ' + nf1.format(rata) + ' ekor/kandang' : 'seluruh kandang ' + meta.f(rata)) : '') + '</div><div class="kbars">';
  rows.forEach(function (x) {
    var v = x[meta.k], w = v != null ? Math.max(3, v / mx * 100) : 0, c = { A: '#0d4715', B: '#4f7fb0', C: '#c9a227' }[x.blok] || '#8a8f8c';
    h += '<div class="kb"><span class="kn">' + esc(x.nama) + '</span><div class="kt"><div class="kf" style="width:' + w.toFixed(1) + '%;background:' + c + '"></div></div>' +

         (m === 'aktif' ? '' : '<div class="ks">' + x.aktif + ' ekor (' + x.jantan + 'J/' + x.betina + 'B)' + (x.sakit ? ' · <span class="neg">' + x.sakit + ' sakit</span>' : '') + '</div>');
  });

  return h;
}

function readImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      try {
        var tries = [[1024, 0.72], [800, 0.64], [640, 0.56]], out = null;
        for (var i = 0; i < tries.length; i++) {
          var sc = Math.min(1, tries[i][0] / Math.max(im.naturalWidth, im.naturalHeight));
          var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc));
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var u = c.toDataURL('image/jpeg', tries[i][1]);
          out = { mime: 'image/jpeg', data: u.split(',')[1], preview: u };
          if (out.data.length <= 450000) break;
        }
        URL.revokeObjectURL(url); resolve(out);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Foto tidak bisa dibaca')); };
    im.src = url;
  });
}

function sparkline(seri) {
  var pts = (seri || []).filter(function (x) { return x.kg != null && isFinite(Date.parse(x.d)); });
  if (pts.length < 2) return '<div class="muted small">Grafik muncul setelah 2 kali timbang</div>';
  var W = 140, H = 34, t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length - 1].d); if (t1 === t0) t1 = t0 + 86400000;
  var lo = Math.min.apply(null, pts.map(function (p) { return p.kg; })), hi = Math.max.apply(null, pts.map(function (p) { return p.kg; })); if (hi === lo) hi = lo + 1;
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + (3 + (Date.parse(p.d) - t0) / (t1 - t0) * (W - 6)).toFixed(1) + ' ' + (H - 4 - (p.kg - lo) / (hi - lo) * (H - 8)).toFixed(1); }).join(' ');
  var last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik kenaikan bobot"><path d="' + d + '" fill="none" stroke="#0d4715" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + (W - 3) + '" cy="' + (H - 4 - (last.kg - lo) / (hi - lo) * (H - 8)).toFixed(1) + '" r="3" fill="#0d4715"/></svg>';

function chartBobot(seri, proy) {
  var pts = (seri || []).map(function (x) { return { t: Date.parse(x.d), kg: x.kg, d: x.d }; }).filter(function (x) { return isFinite(x.t) && x.kg != null; });
  if (pts.length < 1) return '<p class="muted small">Belum ada data timbangan.</p>';
  var pr = null;
  if (proy && proy.bobotJual != null && proy.tglJual) { pr = { t: Date.parse(proy.tglJual), kg: proy.bobotJual, d: proy.tglJual }; if (!isFinite(pr.t) || pr.t <= pts[pts.length - 1].t) pr = null; }
  var all = pts.concat(pr ? [pr] : []);
  var W = 320, H = 150, L = 34, R = 10, T = 12, B = 22;
  var t0 = all[0].t, t1 = all[all.length - 1].t; if (t1 === t0) t1 = t0 + 86400000;
  var lo = Math.min.apply(null, all.map(function (x) { return x.kg; })), hi = Math.max.apply(null, all.map(function (x) { return x.kg; }));
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
  var X = function (t) { return L + (t - t0) / (t1 - t0) * (W - L - R); };
  var Y = function (k) { return T + (hi - k) / (hi - lo) * (H - T - B); };
  var d1 = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.kg).toFixed(1); }).join(' ');
  var last = pts[pts.length - 1];
  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik bobot terhadap waktu">';
  [lo, (lo + hi) / 2, hi].forEach(function (k) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(k).toFixed(1) + '" y2="' + Y(k).toFixed(1) + '" stroke="#e3e9e4"/><text x="' + (L - 4) + '" y="' + (Y(k) + 4).toFixed(1) + '" font-size="10" text-anchor="end" fill="#6b7a70">' + Math.round(k) + '</text>';
  });
  svg += '<path d="' + d1 + '" fill="none" stroke="#0d4715" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  if (pts.length <= 40) pts.forEach(function (p) { svg += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.kg).toFixed(1) + '" r="3" fill="#0d4715"/>'; });
  if (pr) svg += '<path d="M' + X(last.t).toFixed(1) + ' ' + Y(last.kg).toFixed(1) + ' L' + X(pr.t).toFixed(1) + ' ' + Y(pr.kg).toFixed(1) + '" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="' + X(pr.t).toFixed(1) + '" cy="' + Y(pr.kg).toFixed(1) + '" r="4" fill="#fff" stroke="#b7791f" stroke-width="2"/>';
  svg += '<text x="' + L + '" y="' + (H - 6) + '" font-size="10" fill="#6b7a70">' + esc(tglPendek(all[0].d)) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" font-size="10" text-anchor="end" fill="#6b7a70">' + esc(tglPendek(all[all.length - 1].d)) + '</text></svg>';
  return svg + '<div class="muted small"><span class="dot" style="background:#0d4715"></span>Timbangan' + (pr ? ' &nbsp; <span class="dot" style="background:#b7791f"></span>Proyeksi sampai jual (' + nf1.format(pr.kg) + ' kg)' : '') + '</div>';
}

/* ---------------- terbilang & format tanggal ---------------- */
function terbilang(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'nol';
  var s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  function t(x) {
    x = Math.floor(x);
    if (x < 12) return s[x];
    if (x < 20) return s[x - 10] + ' belas';
    if (x < 100) return s[Math.floor(x / 10)] + ' puluh' + (x % 10 ? ' ' + s[x % 10] : '');
    if (x < 200) return 'seratus' + (x - 100 ? ' ' + t(x - 100) : '');
    if (x < 1000) return s[Math.floor(x / 100)] + ' ratus' + (x % 100 ? ' ' + t(x % 100) : '');
    if (x < 2000) return 'seribu' + (x - 1000 ? ' ' + t(x - 1000) : '');
    if (x < 1e6) return t(Math.floor(x / 1e3)) + ' ribu' + (x % 1e3 ? ' ' + t(x % 1e3) : '');
    if (x < 1e9) return t(Math.floor(x / 1e6)) + ' juta' + (x % 1e6 ? ' ' + t(x % 1e6) : '');
    if (x < 1e12) return t(Math.floor(x / 1e9)) + ' miliar' + (x % 1e9 ? ' ' + t(x % 1e9) : '');
    return t(Math.floor(x / 1e12)) + ' triliun' + (x % 1e12 ? ' ' + t(x % 1e12) : '');
  }
  return t(n);
}
function rupiahTerbilang(n) { var x = terbilang(n); return x.charAt(0).toUpperCase() + x.slice(1) + ' rupiah'; }
var BLN_S = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var BLN_L = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function tglId(iso, panjang) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); if (!m) return '';
  return (panjang ? String(Number(m[3])) : m[3]) + ' ' + (panjang ? BLN_L : BLN_S)[Number(m[2]) - 1] + ' ' + m[1];
}
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function waNomor(t) {
  var d = digits(t); if (!d) return '';
  if (d.indexOf('0') === 0) d = '62' + d.slice(1);
  return d.length >= 9 && d.length <= 15 ? d : '';
}

      if (r.ok) { q.shift(); sent++; qSet(q); }

function nBulanOpsi(pilih) {
  var d = new Date(), o = '';
  for (var i = 0; i < 12; i++) {
    var y = d.getFullYear(), m = d.getMonth() + 1, v = y + '-' + (m < 10 ? '0' : '') + m;
    o += '<option value="' + v + '"' + (v === pilih ? ' selected' : '') + '>' + BLN[m - 1] + ' ' + y + '</option>';
    d.setMonth(d.getMonth() - 1);
  }
  return o;
}
function nBulanLalu() { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1); }
function nBytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function nUnduhPdf(nama, bulan, tombol) {
  if (tombol) tombol.disabled = true;
  toast('Menyiapkan laporan PDF…');
  try {
    var r = await api('wa_laporanPdf', S.pin, nama || '', bulan);
    if (!r || !r.ok) { toast((r && r.error) || 'Gagal membuat laporan', 'err'); return; }
    var blob = new Blob([nBytes(r.b64)], { type: 'application/pdf' }), file = new File([blob], r.nama, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: r.nama }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    var u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = r.nama; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 20000);
    toast('PDF ' + r.nama + ' tersimpan', 'ok');
  } catch (e) { toast('Tidak ada sinyal. Coba lagi.', 'err'); }
  finally { if (tombol) tombol.disabled = false; }
}

function renderMut() {
  var box = $('#s-mut'), r = S.mut;
  if (!r) { box.innerHTML = '<p class="muted small" style="padding:6px">Memuat mutasi…</p>'; return; }
  var fl = S.mutF || 'semua', oleh = S.mutOleh || '';
  var orang = []; r.rows.forEach(function (t) { if (orang.indexOf(t.oleh) < 0) orang.push(t.oleh); });
  var kat = S.mutKat || '', urut = S.mutS || 'tgl_asc', kats = []; r.rows.forEach(function (t) { if (kats.indexOf(t.kat) < 0) kats.push(t.kat); }); kats.sort();

  var jml = function (t) { return t.masuk > 0 ? t.masuk : t.keluar; }, cmpS = function (a, b) { return a < b ? -1 : a > b ? 1 : 0; };
  var SORTS = { tgl_asc: ['Tanggal: terlama dulu', null], tgl_desc: ['Tanggal: terbaru dulu', null], oleh: ['Penginput (A-Z)', function (t) { return t.oleh; }], kat: ['Kategori (A-Z)', function (t) { return t.kat; }],
    metode: ['Metode (Tunai/Transfer)', function (t) { return t.metode || '-'; }], jml_desc: ['Jumlah: terbesar', null], jml_asc: ['Jumlah: terkecil', null] };
  var idx = {}; r.rows.forEach(function (t, i) { idx[t.d + '|' + i] = i; });

  rows.sort(function (A, B) {
    var a = A.t, b = B.t, c = 0;

    else if (urut === 'jml_desc') c = jml(b) - jml(a);
    else if (urut === 'jml_asc') c = jml(a) - jml(b);
    else if (SORTS[urut] && SORTS[urut][1]) c = cmpS(String(SORTS[urut][1](a)).toLowerCase(), String(SORTS[urut][1](b)).toLowerCase()) || cmpS(a.d, b.d);
    return c || (A.i - B.i);
  });
  rows = rows.map(function (x) { return x.t; });
  var grupKey = function (t) { return urut === 'oleh' ? 'Oleh ' + t.oleh : urut === 'kat' ? t.kat : urut === 'metode' ? (t.metode || '-') : (urut === 'jml_desc' || urut === 'jml_asc') ? '' : tglPendek(t.d); };
  var subtot = {}; rows.forEach(function (t) { var g = grupKey(t); var o = subtot[g] || (subtot[g] = { m: 0, k: 0 }); o.m += t.masuk; o.k += t.keluar; });

    r.daftarBulan.map(function (b) { return '<option value="' + b.b + '"' + (b.b === r.bulan ? ' selected' : '') + '>' + bulanLabel(b.b) + ' (' + b.n + ')</option>'; }).join('') + '</select></div>' +
    '<div class="mut-sum"><div><span>Saldo awal</span><b>' + rp(r.saldoAwal) + '</b></div><div><span>Saldo akhir</span><b>' + rp(r.saldoAkhir) + '</b></div>' +
    '<div><span>Uang masuk</span><b class="pos">+ ' + rp(r.masuk) + '</b></div><div><span>Uang keluar</span><b class="neg">− ' + rp(r.keluar) + '</b></div></div>' +
    '<div class="mut-f">' + [['semua', 'Semua'], ['masuk', 'Masuk'], ['keluar', 'Keluar']].map(function (x) { return '<button type="button" data-mf="' + x[0] + '" class="' + (fl === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') +
    '</div><div class="mut-f"><select id="mut-s" aria-label="Urutkan">' + Object.keys(SORTS).map(function (k) { return '<option value="' + k + '"' + (k === urut ? ' selected' : '') + '>Urutkan: ' + SORTS[k][0] + '</option>'; }).join('') + '</select>' +
    (kats.length > 1 ? '<select id="mut-k" aria-label="Kategori"><option value="">Semua kategori</option>' + kats.map(function (k) { return '<option value="' + esc(k) + '"' + (k === kat ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + '</select>' : '') +

  });

}

/* ---------------- event ---------------- */
document.addEventListener('DOMContentLoaded', function () {
  try {
    var qp = new URLSearchParams(location.search).get('api');
    if (qp && URL_OK.test(qp)) { API_URL = qp; store.set('qf_api', qp); history.replaceState(null, '', location.pathname); }
  } catch (e) { /* abaikan */ }
  $('#srvbox').hidden = !needServer();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !inAppsScript()) navigator.serviceWorker.register('sw.js').catch(function () {});
  $$('[data-logo]').forEach(function (i) { i.src = LOGO; });
  initDrawer();
  nInitUi();
  $('#btnLogin').addEventListener('click', doLogin);
  $('#pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('#usr').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#pin').focus(); });
  $('#goSignup').addEventListener('click', function () { showLoginBox(true); });
  $('#goLogin').addEventListener('click', function () { showLoginBox(false); });
  $('#btnSignup').addEventListener('click', doSignup);
  $('#su-pw2').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSignup(); });
  akunSiap(); mutSiap();
  $('#nav').addEventListener('click', function (e) {
    var b = e.target.closest('button'), t = b && b.getAttribute('data-tab'); if (!t) return;
    if (!window.__qfDirectNav && S.role !== 'investor' && (t === 'prod' || t === 'keu' || t === 'domba')) { addOpen(t); return; }
    go(t);
  });
  $('#btnRefresh').addEventListener('click', function () { lastRefresh = Date.now(); refreshAll(); flushQueue(true); });
  $('#btnMenu').addEventListener('click', showMenu);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#dvBack').addEventListener('click', closeDocView);
  $('#dvPrint').addEventListener('click', printDoc);
  $('#dvWaPdf').addEventListener('click', function () { shareDoc('pdf'); });
  $('#dvWaJpg').addEventListener('click', function () { shareDoc('jpg'); });
  $('#dvAct').addEventListener('click', function (e) {
    var b = e.target.closest('#dvKw'); if (!b) return;
    var no = b.getAttribute('data-no'); closeDocView(); go('keu', 'input'); setKseg('kw');
    $('#kw-ref').value = no; $('#kw-ref').dispatchEvent(new Event('change'));
  });
  $('#s-lap').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lm]'); if (b) { S.lapMode = b.getAttribute('data-lm'); renderLap(); return; }
    b = e.target.closest('[data-lt]'); if (b) { S.lapTab = b.getAttribute('data-lt'); renderLap(); if (S.lapTab === 'prod' && !S.lap) loadLap(); return; }
    b = e.target.closest('#rek-sub [data-r]'); if (b) { S.rekSub = b.getAttribute('data-r'); renderRekap(); return; }
    b = e.target.closest('[data-dt]'); if (b) { S.dashTab = b.getAttribute('data-dt'); renderRekap(); window.scrollTo(0, 0); return; }
    if (e.target.closest('#rep-pdf')) { shareLapKeu(); return; }
  });
  $('#s-lap').addEventListener('change', function (e) { if (e.target.id === 'rep-bln') S.repBulan = Number(e.target.value); });
  $('#sheet').addEventListener('click', function (e) {
    if (e.target.id === 'sheet') closeSheet();
    var del = e.target.getAttribute && e.target.getAttribute('data-del');
    if (del !== null && del !== undefined && e.target.getAttribute('data-del') !== null) { var q = qGet(); q.splice(Number(del), 1); qSet(q); showQueue(); }
    var act = e.target.getAttribute && e.target.getAttribute('data-act');
    if (act) { var tag = e.target.getAttribute('data-tag'); closeSheet(); goInput(act, tag); }
  });
  $('#q').addEventListener('input', function () { S.q = this.value; renderDomba(); });
  $('#fkandang').addEventListener('change', function () { S.kandang = this.value; renderDomba(); });
  $('#fchips').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { S.filter = b.getAttribute('data-c'); renderDomba(); } });
  $('#dlist').addEventListener('click', function (e) { var r = e.target.closest('[data-tag]'); if (r) openDetail(r.getAttribute('data-tag')); });
  window.addEventListener('online', function () { flushQueue(); refreshAll(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.pin) { flushQueue(); softRefresh(); } });
  setInterval(function () { if (S.pin && qGet().length) flushQueue(); }, 45000);

  var ses = loadSession();
  if (ses) {
    S.pin = ses.pin; S.ss = ses.ss || ''; S.me = ses.me || { user: '', orang: '', adaAkun: false }; S.role = ses.role; S.nama = ses.nama || S.nama; S.investor = ses.investor || ''; S.inv = ses.inv || null; S.lap = ses.lap || null; S.invList = ses.invList || []; S.invPilih = ses.invPilih || ''; S.tab = ses.role === 'investor' ? 'inv' : 'home'; S.ringkas = ses.ringkas; S.domba = ses.domba; S.lists = ses.lists; S.ts = ses.ts || 0;
    startApp(false); if (S.ringkas || S.inv) { setSync('offline'); if (S.ringkas) initLists(); }
  }
});
/* ================= modul Kandang (kode di #kd-src, dimuat saat tab pertama dibuka) ================= */
var KDL = {
  inst: null, err: '',
  load: function () {
    if (KDL.inst) return KDL.inst;
    if (KDL.err) return null;
    try {
      var src = document.getElementById('kd-src').textContent;
      var sc = document.createElement('script'); sc.textContent = src; document.body.appendChild(sc);
      KDL.inst = window.__KD_FACTORY({ api: api, toast: toast, getApp: function () { return S; },
        openDetail: function (t) { openDetail(t); }, goInput: function (f, t) { goInput(f, t); }, logout: logout });
    } catch (e) { KDL.err = String(e && e.message ? e.message : e); }
    return KDL.inst;
  },
  show: function () {
    var k = KDL.load();
    if (k) k.show();
    else $('#s-kandang').innerHTML = '<div class="card"><b>Tab Kandang gagal dimuat.</b><p class="muted small">' + esc(KDL.err || 'Kode modul tidak ditemukan') + '</p></div>';
  },
  goto: function (tab, seg) { go('prod', 'kandang'); if (KDL.inst) KDL.inst.goto(tab, seg); },
  reset: function () { if (KDL.inst) KDL.inst.reset(); }
};
})();
</script>
</body>
