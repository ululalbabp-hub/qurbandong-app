<script>
/* Tema otomatis: terang pukul 06.00-17.59, gelap selain itu (mengikuti jam HP). Bisa dipaksa lewat menu. Dipasang di awal agar tidak berkedip. */
(function () {
  try {
    var p = localStorage.getItem('qf_tema') || 'auto', h = new Date().getHours();
    var gelap = p === 'gelap' || (p !== 'terang' && (h < 6 || h >= 18));
    document.documentElement.setAttribute('data-tema', gelap ? 'dark' : 'light');
  } catch (e) { var hh = new Date().getHours(); document.documentElement.setAttribute('data-tema', (hh < 6 || hh >= 18) ? 'dark' : 'light'); }
})();
</script>

<style>

/* ===== tema elegan: hijau tua + oranye logo ===== */
:root{--gd:#093010;--sh:0 1px 2px rgba(13,71,21,.06),0 6px 18px rgba(13,71,21,.07)}
body{background:var(--bg);letter-spacing:.005em}
.login{background:radial-gradient(120% 70% at 50% 0,#eaf3e8 0,var(--bg) 62%)}
.login h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;letter-spacing:.02em}
.login h1::after{content:"";display:block;width:46px;height:3px;border-radius:3px;background:var(--o);margin:10px auto 0}
.btn{background:linear-gradient(180deg,#14601e,var(--g));box-shadow:0 4px 12px rgba(13,71,21,.25);letter-spacing:.02em}
.btn.ghost{background:#fff;box-shadow:none}
.btn.wa{background:linear-gradient(180deg,#f08a40,var(--o));box-shadow:0 3px 10px rgba(233,118,43,.3)}
.top{background:linear-gradient(135deg,var(--gd),var(--g) 70%);border-bottom:3px solid var(--o);box-shadow:0 4px 14px rgba(13,71,21,.25)}
.ttl{font-family:Georgia,"Times New Roman",serif;letter-spacing:.03em}
.card{border-radius:16px;box-shadow:var(--sh);border-color:var(--bd)}
.card h3,.sec{letter-spacing:.03em}
.card h3{padding-bottom:6px;border-bottom:1px solid var(--bd)}
.kpi{border-radius:16px;box-shadow:var(--sh)}
.kpi.big{background:linear-gradient(135deg,var(--gd),var(--g) 65%,#1c6a28);border-bottom:4px solid var(--o)}
.kpi .v{color:var(--g)}.kpi.big .v{color:#fff}
.seg{background:#ebe8dc}.seg button.on{color:var(--g);box-shadow:0 1px 4px rgba(13,71,21,.18);border-bottom:2px solid var(--o)}
.chips button.on{background:var(--g);border-color:var(--g)}
.radio label:has(input:checked){border-color:var(--o);background:#fff3ea}
input:focus,select:focus{outline:2px solid var(--o);border-color:var(--o)}
.nav{box-shadow:0 -4px 16px rgba(13,71,21,.08);border-top:1px solid var(--bd)}
.nav button.on{color:var(--g)}.nav button.on .e{filter:none}
.nav button.on::after{content:"";display:block;width:22px;height:3px;border-radius:3px;background:var(--o);margin:3px auto 0}
.dv-bar{background:linear-gradient(135deg,var(--gd),var(--g));border-bottom:3px solid var(--o)}
.dv-wa{max-width:780px;margin:12px auto 0;padding:12px 14px;background:#fff;border:1px solid var(--bd);border-left:4px solid var(--o);border-radius:12px;box-shadow:var(--sh);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}

.invadd{margin-top:12px}.invadd summary{font-weight:700;color:var(--g);cursor:pointer;padding:2px 0}.invadd form{margin-top:6px}

.neg{color:var(--bad)}.pos{color:var(--ok)}

/* ---- modul Kandang (digabung dari web app Pakan & Kandang) ---- */
#s-kandang{--bg:#f5f7f2;--surface:#fff;--sunk:#f1f5ee;--tint:#e7f0e4;--ink:#1a2b1e;--muted:#68776b;--line:#e2e9dd;--accent:#0d4715;--accent-2:#2f6b38;--accent-ink:#fff;--orange:#e9762b;--orange-ink:#b0531a;--orange-soft:#fdefe5;--hay:#b0531a;--gold:#e9762b;--hay-soft:#fdefe5;--ok:#2c7539;--ok-soft:#e5f1e3;--warn:#a2620b;--warn-soft:#fdf2e1;--bad:#b0392d;--bad-soft:#fbe5e2;--info:#2b5f86;--info-soft:#e7f0f7;--shadow:0 1px 2px rgba(13,71,21,.05),0 6px 22px rgba(13,71,21,.07);--r:18px;--rs:12px;--f-display:inherit;--f-body:inherit;--f-mono:inherit;color:var(--ink);font-size:15px;line-height:1.55}

#s-kandang .qa{display:grid;justify-items:center;gap:6px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 6px;font:600 12.5px var(--f-body);color:var(--ink);cursor:pointer;text-align:center;transition:transform .15s}
#s-kandang .qa:active{transform:scale(.97)}
#s-kandang .qa span{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--tint)}
#s-kandang .qa:nth-child(even) span{background:var(--orange-soft)}
#s-kandang .qa svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#s-kandang .qa:nth-child(even) svg{stroke:var(--orange-ink)}
#s-kandang .ring{width:52px;height:52px}
#s-kandang .tasks{display:grid;gap:6px}
#s-kandang .task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--rs);background:var(--sunk);cursor:pointer;transition:background .15s}
#s-kandang .task input{width:20px;height:20px;accent-color:var(--accent)}
#s-kandang .task b{font-weight:600;font-size:14px;display:block}
#s-kandang .task small{color:var(--muted);font-size:12px}
#s-kandang .task.done{background:var(--ok-soft)}
#s-kandang .task.done b{text-decoration:line-through;color:var(--muted)}
#s-kandang .kpi.click{cursor:pointer;transition:transform .15s}
#s-kandang .kpi.click:hover{transform:translateY(-2px)}
#s-kandang .kpi .v small{font-size:13px;font-weight:600;color:var(--muted)}
#s-kandang .taglink{cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
#s-kandang .rowbtn{width:100%;border:0;text-align:left;cursor:pointer;font-family:var(--f-body);color:var(--ink)}
#s-kandang .blokgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
#s-kandang .palungs{display:grid;gap:8px;margin-top:12px}
#s-kandang .prow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:6px;align-items:stretch}
#s-kandang .pbar{display:grid;place-items:center;border-radius:8px;background:repeating-linear-gradient(90deg,var(--orange-soft) 0 6px,color-mix(in srgb,var(--orange) 22%,var(--surface)) 6px 12px);font-size:10px;font-weight:700;color:var(--orange-ink);text-align:center;padding:2px;line-height:1.2}
#s-kandang .kcell{position:relative;display:grid;gap:2px;align-content:start;text-align:left;border:0;border-radius:12px;padding:8px 10px;min-height:68px;cursor:pointer;color:var(--ink);font-family:var(--f-body);transition:transform .15s,box-shadow .15s}
#s-kandang .kcell:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
#s-kandang .kcell.dark{color:#fff}
#s-kandang .kcell.none{background:transparent;cursor:default}
#s-kandang .kcell.sick{box-shadow:inset 0 0 0 2px var(--bad)}
#s-kandang .kc-k{font-weight:800;font-size:14px}
#s-kandang .kc-v{font-size:12px;opacity:.85}
#s-kandang .kc-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
#s-kandang .kc-dots i{width:8px;height:8px;border-radius:50%;display:block}
#s-kandang .kc-dots .dj{background:var(--accent);box-shadow:0 0 0 1.5px var(--surface)}
#s-kandang .kc-dots .db{background:var(--orange);box-shadow:0 0 0 1.5px var(--surface)}
#s-kandang .kc-flag{position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
#s-kandang .kc-flag.jual{background:var(--gold)}
#s-kandang .ichart{width:100%;height:auto;display:block;margin-top:6px;touch-action:manipulation}
#s-kandang .tipcap{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--sunk);margin-top:4px}
#s-kandang .tipcap.muted{background:transparent;padding-left:0}
#s-kandang .hbars{display:grid;gap:4px}
#s-kandang .hb{display:grid;grid-template-columns:minmax(70px,30%) minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:transparent;padding:4px 2px;border-radius:8px;cursor:pointer;font-family:var(--f-body);color:var(--ink);text-align:left}
#s-kandang .hb.on,#s-kandang .hb:hover{background:var(--sunk)}
#s-kandang .hb-l{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#s-kandang .hb-t{position:relative;height:14px;border-radius:7px;background:var(--sunk);overflow:visible}
#s-kandang .hb-f{display:block;height:100%;border-radius:7px;transition:width .3s}
#s-kandang .hb-ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--orange)}
#s-kandang .hb-v{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#s-kandang .sl{display:grid;gap:4px;margin:12px 0}
#s-kandang .sl label{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
#s-kandang .sl label b{color:var(--accent);font-variant-numeric:tabular-nums}
#s-kandang .sl input[type=range]{width:100%;accent-color:var(--orange);height:28px}
#s-kandang .tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
#s-kandang .tl-i{position:relative;display:block;padding:7px 0}
#s-kandang .tl-d{position:absolute;left:-23px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--info);box-shadow:0 0 0 3px var(--bg)}
#s-kandang .tl-d.ok{background:var(--ok)}
#s-kandang .tl-d.bad{background:var(--bad)}
#s-kandang .tl-d.hay{background:var(--gold)}
@media (max-width:760px){#s-kandang .prow{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr)}
#s-kandang .blokgrid{grid-template-columns:minmax(0,1fr)}}
#s-kandang .plegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:12px;color:var(--muted)}
#s-kandang .plegend span{display:inline-flex;align-items:center;gap:6px}
#s-kandang .kpis.k2{grid-template-columns:1fr 1fr}
/* ===== tema lembut (seragam dengan webapp Pakan & Kandang): permukaan putih, bayangan halus, sudut bulat ===== */
:root{--bg:#f5f7f2;--card:#fff;--tx:#1a2b1e;--mu:#68776b;--bd:#e2e9dd;--tint:#e7f0e4;--sunk:#f1f5ee;--g2:#2f6b38;--os:#fdefe5;--oi:#b0531a;--sh:0 1px 2px rgba(13,71,21,.05),0 6px 22px rgba(13,71,21,.07)}
html,body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:0}
.login{background:var(--bg)}
.login h1,.ttl,.welcome .wn{font-family:inherit;font-weight:800;letter-spacing:0}
.login h1::after{display:none}
.llogo{width:230px}
.btn{background:var(--g);box-shadow:none;border-radius:12px;letter-spacing:0}
.btn.ghost{background:#fff;border:1px solid var(--bd);color:var(--g)}
.btn.wa{background:var(--o);box-shadow:none}
.top{background:color-mix(in srgb,#fff 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);color:var(--g);border-bottom:1px solid var(--bd);box-shadow:none}
.top .sub{color:var(--mu);opacity:1}
.ttl{color:var(--g);font-size:17px}
.hbadge{background:transparent;padding:0;margin-right:12px}.hbadge img{height:42px}
.ic{background:var(--tint);color:var(--g);border-radius:999px}
.card{border-radius:18px;border:1px solid var(--bd);box-shadow:var(--sh)}
.card h3{border-bottom:0;padding-bottom:0;letter-spacing:0}
.kpi{border-radius:18px;border:1px solid var(--bd);box-shadow:var(--sh)}
.kpi.big{background:var(--tint);color:var(--tx);border:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.kpi.big .l,.kpi.big .rng{color:var(--mu)}.kpi.big .v{color:var(--g)}
.seg{background:var(--tint);border-radius:999px;padding:4px}
.seg button{border-radius:999px}
.seg button.on{background:#fff;color:var(--g);border-bottom:0;box-shadow:0 1px 4px rgba(13,71,21,.12)}
.chips button{border-radius:999px}
.dv-bar{background:rgba(255,255,255,.94);border-bottom:1px solid var(--bd)}
.dv-bar .btn{background:var(--g);color:#fff}.dv-bar .btn.ghost{background:#fff;color:var(--g);border:1px solid var(--bd)}
.dv-wa{border-left:1px solid var(--bd);border-radius:16px}
.welcome{background:var(--tint);color:var(--tx);border-bottom:0;border:1px solid var(--bd);border-radius:20px}
.welcome::before{background:radial-gradient(circle,rgba(233,118,43,.22),rgba(233,118,43,0) 70%)}
.welcome .wk{color:var(--oi)}.welcome p{color:var(--tx)}.welcome .wt{color:var(--oi)}
.nav{background:#fff;box-shadow:none;border-top:1px solid var(--bd)}
.nav button.on::after{background:var(--o)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
.radio label:has(input:checked){border-color:var(--g2);background:var(--tint)}
#s-kandang .kd-tabs{background:var(--tint);border-radius:999px}
#s-kandang .kd-tabs button{border-radius:999px}
#s-kandang .kd-tabs button[aria-selected="true"]{border-bottom:0;box-shadow:0 1px 4px rgba(13,71,21,.12)}
/* ===== 5 tab utama ===== */
.gbar{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
#seg{grid-template-columns:repeat(5,1fr);margin-bottom:12px}
#seg button{padding:9px 2px;font-size:12.5px;white-space:nowrap}
#s-lap #lapSeg{display:none}
.gk-dash #rek-sub{display:none}.gk-lap #rek-sub [data-r=dash]{display:none}
#s-kandang.kd-inputonly .kd-tabs,#s-kandang.kd-inputonly .kd-segcat{display:none}
#s-kandang.kd-inputonly:not([data-kdtab="catat"]) .kd-tabs{display:flex}
#s-kandang .kd-tabs{flex-direction:column;gap:2px;overflow:visible;border-radius:18px;padding:4px}
#s-kandang .kd-tabs button{display:none;width:100%;text-align:left;padding:11px 14px;border-radius:14px;font-size:14px}
#s-kandang .kd-tabs button[aria-selected="true"]{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--g);font-weight:800}
#s-kandang .kd-tabs button[aria-selected="true"]::after{content:"▾";font-size:15px;color:var(--mu)}
#s-kandang .kd-tabs.open button{display:block}
#s-kandang .kd-tabs.open button[aria-selected="true"]{display:flex}
#s-kandang .kd-tabs.open button[aria-selected="true"]::after{content:"▴"}
#s-kandang .kd-tabs.open{box-shadow:var(--sh)}
/* ===== tema Claude x Qurbandong: krem hangat, tinta gelap, judul serif, aksen hijau & oranye ===== */
:root{--bg:#f5f4ee;--card:#fcfbf7;--tx:#141413;--mu:#6b6a63;--bd:#e6e3d8;--tint:#ece9de;--sunk:#f0eee5;--sh:0 1px 2px rgba(20,20,19,.04),0 4px 14px rgba(20,20,19,.045);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
html,body{background:var(--bg);color:var(--tx)}
.ttl,.login h1,.card h3,.lh,.welcome .wn,#s-kandang h1,#s-kandang h2,.crumb{font-family:var(--serif);font-weight:500;letter-spacing:-.005em}
.card h3,.lh{font-size:19px}
.top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--bd);padding:8px 12px}
.ttl{font-size:18px;color:var(--tx);white-space:nowrap}.top .sub{color:var(--mu)}
.hbadge{margin-right:8px}.hbadge img{height:38px}
.ic{background:transparent;color:var(--tx);border-radius:12px}.ic:active{background:var(--tint)}
.ham{font-size:22px;width:40px;height:40px;margin:0 4px 0 -4px}
.card,.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.kpi.big{background:var(--tint)}
.kpi .v{font-family:var(--serif);font-weight:500}
.welcome{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}
.welcome::before{background:radial-gradient(circle,rgba(233,118,43,.18),rgba(233,118,43,0) 70%)}
.btn{background:var(--g);border-radius:12px;font-weight:600}
.btn.ghost{background:transparent;border:1px solid #d8d4c6;color:var(--tx)}
.btn.wa{background:var(--o)}
input,select,textarea{background:#fff;border:1px solid #dcd8ca;border-radius:12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--o);box-shadow:0 0 0 3px rgba(233,118,43,.22)}
.seg,.chips button{background:var(--tint)}
.seg button.on{background:var(--card);color:var(--tx)}
.chips button.on{background:var(--tx);border-color:var(--tx);color:#fff}
.crumb{padding:2px 2px 10px;font-size:15px;color:var(--mu)}
.crumb[hidden]{display:none}
#gbar,#seg,#s-kandang .kd-tabs{display:none!important}
main{padding-bottom:92px}
/* menu samping */
.drw-ov{position:fixed;inset:0;z-index:90;background:rgba(20,20,19,.42)}
.drw{position:fixed;top:0;bottom:0;left:0;z-index:100;width:min(84vw,330px);background:var(--card);border-right:1px solid var(--bd);box-shadow:8px 0 30px rgba(20,20,19,.18);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.drw.o{transform:none}
.drw-h{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--bd)}
.drw-h img{height:46px;width:auto}
.drw-t{font-family:var(--serif);font-size:19px;font-weight:500}
.drw-u{font-size:12.5px;color:var(--mu);margin-top:1px}
.drw-b{flex:1;overflow-y:auto;padding:10px 10px 24px;-webkit-overflow-scrolling:touch}
.drw-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--tx);font:inherit;font-size:15px;padding:11px 12px;border-radius:999px;margin:1px 0}
.drw-i:active{background:var(--tint)}
.drw-i .e{width:22px;text-align:center;font-size:18px;flex:none}
.drw-i .e.dot{width:22px;height:22px;position:relative}.drw-i .e.dot::after{content:"";position:absolute;left:9px;top:9px;width:5px;height:5px;border-radius:50%;background:#bdb9a9}
.drw-i .l{flex:1;min-width:0}
.drw-i .chev{color:var(--mu);transition:transform .18s;font-size:13px}.drw-i .chev.o{transform:rotate(180deg)}
.drw-i.lv1{padding-left:26px;font-size:14.5px}.drw-i.lv2{padding:8px 12px 8px 46px;font-size:14px;color:#3b3a36}
.drw-i.in{font-weight:700}
.drw-i.on{background:#dfe9da;color:var(--g);font-weight:700}
.drw-i.on .e.dot::after{background:var(--g)}
.drw-k{display:none}.drw-k.o{display:block}
/* bilah tab bawah (ikon garis) */
.nav{display:flex;background:var(--card);border-top:1px solid var(--bd);box-shadow:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);font:inherit;font-size:11.5px;font-weight:600;padding:2px 0;min-width:0}
.nav .ni{width:58px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.nav .ni svg{width:23px;height:23px}
.nav button.on{color:var(--g);font-weight:700}.nav button.on .ni{background:#dfe9da}
.nav button.on::after{display:none}
.ic svg{width:22px;height:22px;display:block;margin:auto}
.drw-i .e svg{width:20px;height:20px;display:block;margin:auto}
/* tombol + dan lembar input */
.nav .nav-add{flex:0 0 76px;justify-content:center;padding:0}
.nav-add .plus{width:52px;height:52px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 6px 16px rgba(13,71,21,.32),0 0 0 4px var(--card);transition:transform .12s}
.nav-add:active .plus{transform:scale(.94)}
.nav-add .plus svg{width:26px;height:26px;stroke-width:2.1}
.crumbrow{display:flex;align-items:center;gap:4px;margin:-4px 0 6px -6px}
.crumbrow[hidden]{display:none}
.crumbrow .back{width:38px;height:38px;flex:none;margin:0}
.crumbrow .crumb{padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addsh{position:fixed;left:0;right:0;bottom:0;z-index:100;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 34px rgba(20,20,19,.2);transform:translateY(105%);transition:transform .24s ease;max-height:86vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.addsh.o{transform:none}
.addsh-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 20px}
.addsh-t{font-family:var(--serif);font-size:19px;font-weight:500}
.addsh-b{overflow-y:auto;padding:0 12px 18px}
.addsh-g{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700;padding:12px 8px 4px}
.addsh-i{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:var(--tx);padding:10px 8px;border-radius:14px}
.addsh-i:active{background:var(--tint)}
.addsh-i .ai{width:42px;height:42px;border-radius:12px;background:#e4ece0;color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.addsh-i .ai svg{width:22px;height:22px}
.addsh-i .at{display:flex;flex-direction:column;min-width:0}
.addsh-i .at b{font-size:15px;font-weight:600}
.addsh-i .at small{font-size:12.5px;color:var(--mu);margin-top:1px}
/* dashboard keuangan & laporan */
.dtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 12px}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:1 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;font-size:13.5px;font-weight:600}
.dtabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.donut{display:flex;justify-content:center;margin:2px 0 8px}
.rep-r{display:flex;gap:8px;flex-wrap:wrap}
.rep-r select{flex:1 1 150px;min-width:0}
.rep-r .btn{flex:1 1 210px;display:flex;align-items:center;justify-content:center;gap:8px}
.rep-r .btn svg{width:18px;height:18px}
.addsh-i.on{background:#e4ece0}
.addsh-i.on .ai{background:var(--g);color:#fff}

.login .lbox{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center}
.login .lbox input[type=text],.login .lbox input[type=password]{font-size:16px;padding:13px;margin:7px 0}
.lnk{background:none;border:0;color:var(--g);font:inherit;font-size:14px;text-decoration:underline;padding:8px;cursor:pointer;margin-top:4px}
.ok-msg{color:var(--ok)!important;font-weight:600}
.acc-r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eef2ee}
.acc-r .n{min-width:0}.acc-r .n b{display:block}.acc-r .n span{font-size:12.5px;color:var(--mu)}
.acc-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acc-b button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.acc-b button.pri{background:var(--g);color:#fff;border-color:var(--g)}.acc-b button.bad{color:#9c0006}
.acc-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:14px 0 2px}
.acc-f label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}.acc-f input,.acc-f select{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card)}
.mut-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mut-sum div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}

/* ===== BRAND QD BEGIN: palet Champagne #FFE5C8 · Pumpkin #E9762B · Hunter #41644A · Pakistan #0D4715 · Jet #2A2D2B ===== */
:root{--cp:#ffe5c8;--pk:#e9762b;--hn:#41644a;--pg:#0d4715;--jt:#2a2d2b;
--bg:#fff6ec;--card:#fffdf9;--tx:#2a2d2b;--mu:#6b706c;--bd:#f1dcc2;--tint:#fde9d2;--sunk:#fbeedd;
--g:#0d4715;--g2:#41644a;--gd:#08290c;--o:#e9762b;--os:#fff0e2;--oi:#b0531a;
--sh:0 1px 2px rgba(42,45,43,.05),0 8px 24px rgba(65,100,74,.10);--ease:cubic-bezier(.2,.8,.2,1)}
#s-kandang{--bg:#fff6ec;--surface:#fffdf9;--sunk:#fbeedd;--tint:#fde9d2;--ink:#2a2d2b;--muted:#6b706c;--line:#f1dcc2;--accent:#0d4715;--accent-2:#41644a;--orange:#e9762b;--orange-ink:#b0531a;--orange-soft:#fff0e2;--shadow:0 1px 2px rgba(42,45,43,.05),0 8px 24px rgba(65,100,74,.10)}
html,body{background:var(--bg);color:var(--tx)}
html:not([data-tema=dark]) body{background:radial-gradient(1200px 500px at 100% -10%,rgba(233,118,43,.10),transparent 60%),radial-gradient(900px 500px at -10% 0%,rgba(65,100,74,.10),transparent 55%),var(--bg);background-attachment:fixed}
/* header */
.top{background:linear-gradient(120deg,#0d4715 0%,#2c5a37 60%,#41644a 100%);color:#fff;border-bottom:3px solid var(--pk);box-shadow:0 6px 18px rgba(13,71,21,.28);backdrop-filter:none;-webkit-backdrop-filter:none}
.top .ttl,.top .sub{color:#fff}.top .sub{color:var(--cp);opacity:.92}
.top .ic{background:rgba(255,229,200,.16);color:#fff;transition:transform .15s var(--ease),background .2s}
.top .ic:active{transform:scale(.9);background:rgba(255,229,200,.3)}
.top .hbadge{background:var(--cp);border-radius:12px;padding:3px 6px}
.top .hbadge img{height:34px}
/* tombol */
.btn{background:linear-gradient(135deg,#0d4715,#41644a);color:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(13,71,21,.28);transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.975);box-shadow:0 2px 8px rgba(13,71,21,.25)}
.btn.ghost{background:var(--card);color:var(--g);border:1.5px solid var(--hn);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#f08a40,#e9762b);color:#fff;box-shadow:0 6px 16px rgba(233,118,43,.35)}
/* kartu */
.card,.kpi{background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
@media(hover:hover){.card:hover,.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(42,45,43,.06),0 14px 30px rgba(65,100,74,.16)}}
.card>h3:first-child::before{content:"";display:inline-block;width:4px;height:15px;border-radius:3px;background:var(--pk);margin-right:8px;vertical-align:-2px}
.kpi .v{color:var(--g)}
.kpi.big{background:linear-gradient(135deg,#0d4715 0%,#2f5a39 70%,#41644a 100%);color:#fff;border:0;border-bottom:4px solid var(--pk);position:relative;overflow:hidden}
.kpi.big::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(233,118,43,.45),transparent 70%);pointer-events:none}
.kpi.big .v{color:#fff}.kpi.big .l,.kpi.big .rng{color:var(--cp)}
.kpi.sakit .v{color:var(--pk)}
/* chip & tab */
.chips button,.seg button,.mut-f button{transition:background .2s,color .2s,transform .15s var(--ease)}
.chips button:active,.seg button:active,.mut-f button:active{transform:scale(.94)}
.chips button.on,.mut-f button.on{background:var(--g);border-color:var(--g);color:var(--cp)}
.seg button.on{background:var(--g);color:var(--cp)}
.c-AMAN,.c-Sehat{background:#dfeadb;color:#0d4715}.c-WASPADA,.c-Sakit{background:#ffe5c8;color:#a14a10}
/* navigasi bawah */
.nav{background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -6px 20px rgba(65,100,74,.12)}
.nav button{transition:color .2s}
.nav button.on{color:var(--g)}
.nav button.on .e,.nav button.on svg{animation:qdPop .45s var(--ease)}
.nav button.on::after{background:var(--pk);width:20px}
/* tombol + tengah */
.nav-add .plus{background:linear-gradient(135deg,#f08a40,#e9762b);color:#fff;box-shadow:0 8px 20px rgba(233,118,43,.45),0 0 0 4px var(--card);animation:qdPulse 2.8s ease-in-out infinite}
/* drawer & sheet */
.drw-h{background:linear-gradient(135deg,var(--cp),#fff3e3);border-bottom:2px solid var(--pk)}
.drw-t{color:var(--g)}
.drw-i{transition:background .2s,transform .15s var(--ease)}.drw-i:active{background:var(--cp);transform:translateX(3px)}
.drw-i.on,.drw-i.cur{background:var(--cp);color:var(--g)}
.toast{background:var(--jt);border-left:4px solid var(--pk)}
/* login */
.login{background:linear-gradient(160deg,#0d4715 0%,#2f5a39 55%,#41644a 100%);color:var(--cp);position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-160px;top:-140px;background:radial-gradient(circle,rgba(233,118,43,.5),transparent 68%)}
.login::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;left:-150px;bottom:-150px;background:radial-gradient(circle,rgba(255,229,200,.22),transparent 68%)}
.login>*{position:relative;z-index:1}
.login h1{color:var(--cp);letter-spacing:.02em}.login .muted,.login .chk,.login p{color:rgba(255,229,200,.85)}
.login .llogo{background:var(--cp);border-radius:22px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28);animation:qdFloat 5s ease-in-out infinite}
.login input[type=password],.login input[type=text]{background:#fffdf9;color:var(--jt);border:2px solid transparent;transition:border-color .2s,box-shadow .2s}
.login input:focus{border-color:var(--pk);box-shadow:0 0 0 4px rgba(233,118,43,.25);outline:0}
.login .btn{background:linear-gradient(135deg,#f08a40,#e9762b);box-shadow:0 8px 22px rgba(233,118,43,.45)}
.login .err{color:#ffc9a8}.login a,.login .lnk{color:var(--cp)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pk)!important;box-shadow:0 0 0 3px rgba(233,118,43,.20)}
/* gerak halaman */
.screen{animation:qdIn .38s var(--ease) both}
.screen>.card,.screen>.grid2>.kpi,.screen>.grid2>.card{animation:qdUp .45s var(--ease) both}
.screen>*:nth-child(1){animation-delay:.02s}.screen>*:nth-child(2){animation-delay:.07s}.screen>*:nth-child(3){animation-delay:.12s}.screen>*:nth-child(4){animation-delay:.17s}.screen>*:nth-child(5){animation-delay:.22s}.screen>*:nth-child(n+6){animation-delay:.26s}
.row{transition:background .15s}.row:active{background:var(--tint)}
@keyframes qdIn{from{opacity:0}to{opacity:1}}
@keyframes qdUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes qdPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes qdPulse{0%,100%{box-shadow:0 8px 20px rgba(233,118,43,.45)}50%{box-shadow:0 8px 28px rgba(233,118,43,.75),0 0 0 8px rgba(233,118,43,.12)}}
@keyframes qdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* mode gelap berbasis Jet #2A2D2B */
html[data-tema=dark]{--bg:#1c1e1d;--card:#2a2d2b;--tx:#f4ede3;--mu:#aab0ab;--bd:#3b403d;--tint:#31382f;--sunk:#232625;--os:#3b2a1c;--oi:#f2ad80;--g:#8cc79a;--g2:#81ad8c;--gd:#08290c;--o:#ee8a46;--bad:#ff9a8d;--warn:#f2b45c;--ok:#8fd69c;--sh:0 1px 2px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.35)}

html[data-tema=dark] body{background:radial-gradient(1000px 480px at 100% -10%,rgba(233,118,43,.10),transparent 60%),radial-gradient(800px 480px at -10% 0%,rgba(65,100,74,.22),transparent 55%),#1c1e1d;background-attachment:fixed;color:var(--tx)}
html[data-tema=dark] .top{background:linear-gradient(120deg,#08290c,#143d1b 60%,#2c4a35);border-bottom-color:var(--pk)}

html[data-tema=dark] .chips button.on,html[data-tema=dark] .mut-f button.on,html[data-tema=dark] .seg button.on{background:#2d6a37;border-color:#2d6a37;color:#fff}

    x.probMl=probPerKg*x.sil;x.cKap=x.kapG/1000*T.hKapur;x.cProb=x.probMl/1000*T.hProb;
    x.cA=x.sil*a*S.b.ampas.h;x.cK=(x.sil*k+x.kt)*K.h;x.cM=x.sil*m*M.h;x.cO=x.od*O.h;
    x.cSil=x.sil*c.price+x.cKap+x.cProb;x.cKt=x.kt*K.h;x.cost=x.cSil+x.cKt+x.cO;x.diff=G.anggaran-x.cost;
    x.costMon=x.cost*dpm;x.costKg=x.adg>0?x.cost/(x.adg/1000):null;
  });
  const av=f=>months.reduce((s,x)=>s+f(x),0)/6;
  const tot={cost:months.reduce((s,x)=>s+x.costMon,0),budget:G.anggaran*G.hari,ampas:months.reduce((s,x)=>s+x.fA*dpm,0),kons:months.reduce((s,x)=>s+x.fK*dpm,0),odot:months.reduce((s,x)=>s+x.fO*dpm,0),sil:months.reduce((s,x)=>s+x.sil*dpm,0)};
  const avg={cost:av(x=>x.cost),bkPct:av(x=>x.bk/x.reqBK),pkPct:av(x=>x.pkPct),tdnPct:av(x=>x.tdnPct),me:av(x=>x.me),caP:av(x=>x.caP),odShare:av(x=>x.odShare),adg:av(x=>x.adg)};
  const gainKg=G.bbPanen-G.bbAwal;
  return {o,c,months,tot,avg,targetADG:gainKg/G.hari*1000,costPerKg:tot.cost/(avg.adg/1000*G.hari),ekorHariPerTon:tot.ampas>0?1000/(tot.ampas/G.hari):0};
}
function odW(){const J=S.jadwal;return J.pakaiLayu?Math.max(.5,1-(+J.layu||0)):1}
function stageOf(w){const G=S.g,st=(G.bbPanen-G.bbAwal)/6;return Math.min(6,Math.max(1,Math.floor((w-G.bbAwal)/st+1e-9)+1))}
function palungOf(pos){return S.palung.find(p=>p[0]&&(p[1]===pos||(p[2]&&p[2]===pos)))}
function feedAll(R){
  const t=today0();
  return S.domba.map(s=>{
    const aktif=s.status==='Sehat'||s.status==='Sakit';
    const masuk=pd(s.masuk),tb=pd(s.timbang);
    const hari=masuk?days(masuk,t):null,stale=tb?days(tb,t):null;
    if(!aktif||!(s.bobot>0))return {s,aktif:false,hari,stale};
    const st=stageOf(s.bobot),mo=R.months[st-1],f=s.bobot/mo.bb;
    let ad=1;if(S.jadwal.adapt&&hari!=null&&hari>=0&&hari<12)ad=hari<4?.25:hari<8?.5:.75;
    const pal=palungOf(s.posisi);
    return {s,aktif:true,st,f,ad,hari,stale,mo,sil:mo.sil*f*ad,od:mo.od*f,kt:mo.kt*f,kap:mo.kapG*f*ad,prob:mo.probMl*f*ad,cost:f*(mo.cSil*ad+mo.cKt+mo.cO),pal:pal?pal[0]:null};
  });
}
function palungRows(F){
  return S.palung.filter(p=>p[0]).map(([id,k1,k2])=>{
    const mem=F.filter(x=>x.aktif&&x.pal===id);
    const n=mem.length,w=mem.map(x=>x.s.bobot);
    const r={id,k1,k2,kandang:k2?k1+' ⇄ '+k2:k1,mem,n,avg:n?w.reduce((a,b)=>a+b,0)/n:0,range:n?Math.max(...w)-Math.min(...w):0,
      sil:mem.reduce((a,x)=>a+x.sil,0),od:mem.reduce((a,x)=>a+x.od,0),kt:mem.reduce((a,x)=>a+x.kt,0),kap:mem.reduce((a,x)=>a+x.kap,0),prob:mem.reduce((a,x)=>a+x.prob,0),cost:mem.reduce((a,x)=>a+x.cost,0)};
    return r;
  });
}
function kandangList(){const s=new Set();S.palung.forEach(p=>{if(p[1])s.add(p[1]);if(p[2])s.add(p[2])});return [...s]}

/* ============ RENDER: SILASE ============ */
const WADAH=[['Drum plastik 200 L',140],['Drum plastik 120 L',80],['Tong plastik 60 L',40],['Karung plastik dobel + kantong',25]];
function rSilase(){
  const si=S.sil,oi=si.opsi<0?S.aktif:si.opsi,o=S.opsi[oi],R=calc(o),c=R.c,A=S.b.ampas,M=S.b.mol,T=S.t;
  const amp=+si.ampas||0,kn=amp*c.konsPerTon/1000,ml=amp*c.molPerTon/1000,kp=amp*c.kapurPerTon/1000,pb=amp*c.probPerTon/1000,tot=amp+kn+ml+kp;
  const molL=ml/1.4,air=Math.min(molL,amp*0.02);
  const cost=amp*A.h+kn*c.K.h+ml*M.h+kp*T.hKapur+pb*T.hProb;
  const F=feedAll(R),auto=F.filter(x=>x.aktif).reduce((a,x)=>a+x.sil,0);
  const kons2=si.mode==='auto'?auto:(+si.manual||0);
  const dur=kons2>0?tot/kons2:Infinity;
  const nW=si.wadahKg>0?Math.ceil(tot/si.wadahKg):0;
  const openD=kons2>0?si.wadahKg/kons2:Infinity;
  const t0=pd(si.tgl)||today0(),ready=addD(t0,7),limit=addD(t0,42),habis=isFinite(dur)?addD(ready,dur):null;
  const ampRec=kons2>0?Math.floor(kons2*32*(amp/tot||c.a)/10)*10:0;
  const wRec=kons2>0?Math.max(5,Math.floor(kons2*4/5)*5):0;
  const tooBig=isFinite(dur)&&7+dur>42;
  const nextBatch=isFinite(dur)?addD(t0,Math.min(dur,35)):null;
  /* kualitas */
  const Q=S.kual,ph=parseFloat(String(si.ph).replace(',','.'));
  const good=['asam','warna','remah','dingin'].filter(k=>Q[k]).length;
  let vd;
  if(Q.busuk||Q.jamurW||Q.lendir||Q.belatung||(isFinite(ph)&&ph>5))vd={c:'bad',t:'Tidak layak diberikan',d:'Buang seluruh isi wadah ini (bisa jadi kompos). Silase busuk atau berjamur berwarna memicu diare, keracunan jamur, dan listeriosis. Cuci wadah dengan sabun, jemur sampai kering sebelum dipakai lagi.'};
  else if(Q.panas)vd={c:'warn',t:'Mulai rusak karena udara masuk',d:'Habiskan hari ini juga, jangan disimpan lagi. Untuk batch berikutnya padatkan lebih kuat dan pastikan tutup kedap.'};
  else if(Q.jamurP)vd={c:'warn',t:'Layak setelah disortir',d:'Buang lapisan berjamur putih di permukaan sampai 5–10 cm. Bagian bawah layak bila aromanya asam segar. Tutup lebih rapat setelah mengambil.'};
  else if(Q.tengik)vd={c:'warn',t:'Kurang baik',d:'Bau tengik seperti mentega basi tanda silase terlalu basah. Berikan sedikit-sedikit dicampur yang baik, amati feses. Batch berikutnya tiriskan ampas tahu lebih lama.'};
  else if(good>=3||(isFinite(ph)&&ph<=4.5&&good>=2))vd={c:'ok',t:'Silase baik, layak diberikan',d:'Ambil secukupnya untuk satu kali pemberian, langsung tutup rapat lagi. Habiskan wadah yang sudah dibuka dalam 3–5 hari.'};
  else vd={c:'info',t:'Centang ciri yang terlihat',d:'Buka wadah, cium aromanya, lihat warna dan tekstur, lalu centang ciri di atas.'};
  const bkW=c.bk<.30?{c:'warn',t:`BK silase ${pc(c.bk)} · terlalu basah`,d:'Kadar air di atas 70% membuat cairan menggenang di dasar wadah dan silase cepat tengik. Tiriskan/peras ampas tahu lebih lama, atau naikkan porsi konsentrat (rasio lebih kecil).'}:c.bk>.45?{c:'warn',t:`BK silase ${pc(c.bk)} · cukup kering`,d:'Campuran kering sulit dipadatkan sehingga udara tertinggal. Injak lebih kuat per lapis.'}:{c:'ok',t:`BK silase ${pc(c.bk)} · kadar air sesuai`,d:'Kadar air 55–70% cocok untuk fermentasi.'};
  const span=Math.max(42,7+(isFinite(dur)?dur:0));
  const w=x=>Math.max(0,x/span*100);
  const useD=isFinite(dur)?Math.min(dur,42-7):0,overD=isFinite(dur)?Math.max(0,7+dur-42):0;
  return `
  <section class="blk">
    <h2>Pembuatan silase fermentasi ampas tahu</h2>
    <p class="lead">Takaran dan jadwal menyesuaikan jumlah ampas tahu, ransum yang dipilih, dan konsumsi kandang Anda. Ampas tahu cepat basi (1–2 hari), jadi fermentasikan di hari kedatangan.</p>
    <div class="form">
      <div class="field"><label class="lbl" for="f-sil-opsi">Ransum</label><select id="f-sil-opsi" data-k="sil.opsi" data-type="num"><option value="-1" ${si.opsi<0?'selected':''}>Ikuti ransum aktif (${esc(S.opsi[S.aktif].nama.split(' · ')[0])})</option>${S.opsi.map((x,i)=>`<option value="${i}" ${si.opsi===i?'selected':''}>${esc(x.nama)}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl" for="${fid('sil.ampas')}">Ampas tahu datang (kg)</label>${inp('sil.ampas',{label:'Ampas tahu kg',min:0})}</div>
      <div class="field"><label class="lbl" for="f-sil-tgl">Tanggal pembuatan</label><input type="date" class="num" style="width:100%" id="f-sil-tgl" data-k="sil.tgl" value="${esc(si.tgl)}"></div>
      <div class="field"><label class="lbl" for="f-wadah">Wadah</label><select id="f-wadah" data-act="wadah">${WADAH.map(x=>`<option value="${x[1]}" ${+si.wadahKg===x[1]?'selected':''}>${x[0]} (±${x[1]} kg)</option>`).join('')}<option value="" ${WADAH.some(x=>x[1]===+si.wadahKg)?'':'selected'}>Lainnya</option></select>
        <div class="row" style="margin-top:4px">${inp('sil.wadahKg',{label:'Isi per wadah kg',cls:'w4'})}<span class="small muted">kg per wadah (perkiraan; timbang 1 wadah penuh untuk angka pasti)</span></div></div>
    </div>
  </section>
  <section class="blk two">
    <div>
      <h3>Resep batch ini</h3>
      <div class="recipe">
        <div><span>Ampas tahu segar</span><b>${nf(amp,0)} kg</b></div>
        <div><span>Konsentrat PK ${o.pk}%</span><b>${nf(kn,1)} kg</b></div>
        <div><span>Molases</span><b>${nf(ml,1)} kg (±${nf(molL,1)} L)</b></div>
        ${o.kapur?`<div><span>Kapur pakan (CaCO₃)</span><b>${nf(kp,2)} kg</b></div><div><span>Probiotik starter (EM4/sejenis)</span><b>${nf(pb,2)} L</b></div>`:''}
        <div><span>Silase jadi</span><b>${nf(tot,0)} kg · ${nW} wadah</b></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn orange" data-act="silToStok">Catat batch ini ke stok</button><span class="small muted">Bahan langsung terpotong dari stok QDF.</span></div>
      <div class="kpis" style="margin-top:12px">
        <div class="kpi"><div class="lbl">Biaya batch</div><div class="v">${rp(cost)}</div><div class="s">${rp(tot?cost/tot:0)}/kg silase</div></div>
        <div class="kpi"><div class="lbl">PK silase</div><div class="v">${pc(c.pk)}</div><div class="s">TDN ${pc(c.tdn)} dari BK</div></div>
      </div>
      <div class="verdict ${bkW.c}"><b>${bkW.t}</b><div>${bkW.d}</div></div>
      ${!o.kapur?`<div class="verdict warn"><b>Ransum ini tanpa kapur</b><div>Rasio Ca:P ransum rata-rata ${nf(R.avg.caP,2)} (di bawah 1,6). Untuk domba jantan ini menaikkan risiko batu saluran kemih. Aktifkan "kapur &amp; probiotik" di tab Ransum &amp; Opsi.</div></div>`:''}
    </div>
    <div>
      <h3>Langkah kerja</h3>
      <ol class="steps">
        <li><div><div class="st">Siapkan wadah dan tempat aduk</div>Cuci dan keringkan <span class="q">${nW} wadah</span> (±${nf(si.wadahKg,0)} kg per wadah). Gelar terpal bersih di tempat teduh. Wadah dan terpal harus kering, sisa air sabun mengganggu fermentasi.</div></li>
        <li><div><div class="st">Tiriskan ampas tahu</div>Tiriskan <span class="q">${nf(amp,0)} kg</span> ampas tahu 2–4 jam dalam karung sampai tidak menetes saat diperas. ${c.bk<.30?'<b>Penting untuk ransum ini karena campurannya tergolong basah.</b>':''} Ampas yang sudah berbau asam busuk jangan dipakai.</div></li>
        <li><div><div class="st">Buat premix kering</div>Aduk <span class="q">${nf(kn,1)} kg konsentrat</span>${o.kapur?` dengan <span class="q">${nf(kp,2)} kg kapur pakan</span>`:''} sampai rata. ${o.kapur?'Kapur dicampur ke konsentrat dulu supaya tidak menggumpal di satu sisi.':''}</div></li>
        <li><div><div class="st">Larutkan molases${o.kapur?' dan probiotik':''}</div>Encerkan <span class="q">${nf(ml,1)} kg molases</span>${o.kapur?` dan <span class="q">${nf(pb,2)} L probiotik</span>`:''} dengan air sumur/galon paling banyak <span class="q">${nf(air,1)} L</span>. Ampas tahu sudah basah, jadi air secukupnya saja. Jangan pakai air PAM berkaporit atau air panas karena mematikan bakteri.</div></li>
        <li><div><div class="st">Campur bertahap</div>Ratakan ampas tahu setebal ±10 cm di terpal, taburkan premix sedikit demi sedikit, siramkan larutan, lalu bolak-balik sampai warna seragam dan tidak ada gumpalan konsentrat.</div></li>
        <li><div><div class="st">Isi dan padatkan</div>Masukkan per lapis 10–15 cm, tekan/injak tiap lapis sampai udara keluar. Isi penuh sampai hampir ke bibir wadah (sisa ruang = udara = jamur).</div></li>
        <li><div><div class="st">Tutup kedap dan beri label</div>Tutup rapat (lapisi plastik di bawah tutup drum). Tulis tanggal <span class="q">${fd(t0)}</span>, ransum, dan nomor wadah. Simpan di tempat teduh, tidak kena hujan, jauh dari tikus.</div></li>
        <li><div><div class="st">Buka mulai ${fd(ready)}</div>Fermentasi 7 hari. Ambil secukupnya untuk satu kali pemberian, langsung tutup lagi. Cek kualitas dengan panduan di bawah setiap membuka wadah baru.</div></li>
      </ol>
    </div>
  </section>
  <section class="blk">
    <h3>Jadwal pemakaian batch</h3>
    <div class="form" style="margin-bottom:10px">
      <div class="field"><label class="lbl" for="f-sil-mode">Konsumsi silase kandang</label><select id="f-sil-mode" data-k="sil.mode"><option value="auto" ${si.mode==='auto'?'selected':''}>Otomatis dari data domba (${nf(auto,1)} kg/hari)</option><option value="manual" ${si.mode==='manual'?'selected':''}>Isi sendiri</option></select></div>
      ${si.mode==='manual'?`<div class="field"><label class="lbl" for="${fid('sil.manual')}">Konsumsi (kg/hari)</label>${inp('sil.manual',{label:'Konsumsi manual'})}</div>`:''}
    </div>
    <div class="bar" role="img" aria-label="Linimasa batch silase">
      <span style="width:${w(7)}%;background:var(--hay)"></span>
      <span style="width:${w(useD)}%;background:var(--accent)"></span>
      <span style="width:${w(overD)}%;background:var(--bad)"></span>
    </div>
    <div class="legend">
      <div><i style="background:var(--hay)"></i>Fermentasi: ${fdS(t0)} – ${fdS(ready)}</div>
      <div><i style="background:var(--accent)"></i>Pemakaian: ${isFinite(dur)?nf(dur,0)+' hari':'—'}, habis ${habis?fd(habis):'—'}</div>
      <div><i style="background:var(--bad)"></i>Lewat batas simpan (${fd(limit)}): ${isFinite(dur)?nf(overD,0)+' hari':'—'}</div>
    </div>
    <div class="alerts" style="margin-top:12px">
      ${tooBig?`<div class="al tinggi"><div class="hd">${chip('bad','Batch terlalu besar')} ${nf(tot,0)} kg silase untuk ${nf(kons2,1)} kg/hari</div><p>Silase tertutup tahan ±4–6 minggu. Dengan konsumsi sekarang, ${nf(overD,0)} hari pemakaian jatuh setelah batas simpan sehingga sebagian besar berisiko rusak.</p><ul><li>Beli ampas tahu paling banyak <b>±${nf(ampRec,0)} kg per batch</b>, ulangi setiap ±4–5 minggu.</li><li>Atau, bila pemasok hanya menjual per ton, bagi dengan peternak lain atau tambah populasi sebelum membeli per ton.</li></ul></div>`:''}
      ${openD>5?`<div class="al sedang"><div class="hd">${chip('warn','Wadah terlalu besar')} 1 wadah terbuka habis dalam ${nf(openD,0)} hari</div><p>Setelah dibuka, silase sebaiknya habis dalam 3–5 hari. Pakai wadah lebih kecil, sekitar <b>${nf(wRec,0)} kg per wadah</b>, supaya setiap wadah habis ±4 hari.</p></div>`:''}
      ${nextBatch&&!tooBig?`<div class="al info"><div class="hd">${chip('info','Batch berikutnya')} Buat pada ${fd(nextBatch)}</div><p>Supaya silase baru siap tepat saat batch ini habis. Pesan ampas tahu ke pemasok 1–2 hari sebelumnya.</p></div>`:''}
    </div>
  </section>
  <section class="blk two">
    <div class="panel">
      <h3>Cek kualitas saat membuka wadah</h3>
      <div class="checks">
        <div class="lbl" style="margin:4px 0">Ciri silase baik</div>
        ${[['asam','Aroma asam segar seperti tapai/yoghurt'],['warna','Warna kuning kecoklatan, seragam'],['remah','Tekstur remah, tidak berlendir'],['dingin','Terasa dingin saat dipegang']].map(([k,t])=>`<label><input type="checkbox" id="q-${k}" data-k="kual.${k}" ${Q[k]?'checked':''}>${t}</label>`).join('')}
        <div class="lbl" style="margin:10px 0 4px">Ciri bermasalah</div>
        ${[['jamurP','Jamur putih tipis hanya di permukaan'],['tengik','Bau tengik seperti mentega basi'],['panas','Terasa hangat/panas di dalam'],['busuk','Bau busuk atau pesing (amonia)'],['jamurW','Jamur hitam, hijau, atau merah muda'],['lendir','Berlendir, menggumpal basah'],['belatung','Ada belatung atau ulat']].map(([k,t])=>`<label><input type="checkbox" id="q-${k}" data-k="kual.${k}" ${Q[k]?'checked':''}>${t}</label>`).join('')}
      </div>
      <div class="row" style="margin-top:8px"><label class="small muted" for="f-sil-ph">pH (bila punya kertas lakmus/pH meter)</label><input type="text" class="num w4" id="f-sil-ph" data-k="sil.ph" value="${esc(si.ph)}" inputmode="decimal"></div>
      <div class="verdict ${vd.c}"><b>${vd.t}</b><div>${vd.d}</div></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="resetKual">Kosongkan centang</button></div>
    </div>
    <div class="panel">
      <h3>Pegangan cepat</h3>
      <div class="kv"><span>pH silase baik</span><span>3,8 – 4,5</span></div>
      <div class="kv"><span>Kadar air campuran</span><span>55 – 70%</span></div>
      <div class="kv"><span>Siap pakai</span><span>hari ke-7</span></div>
      <div class="kv"><span>Tahan tertutup rapat</span><span>4 – 6 minggu</span></div>
      <div class="kv"><span>Setelah dibuka</span><span>habiskan 3 – 5 hari</span></div>
      <div class="kv"><span>Rasio ampas : konsentrat</span><span>${nf(o.r,1)} : 1</span></div>
      <div class="kv"><span>Molases</span><span>${pc(S.g.mol,0)} dari berat campuran</span></div>
      ${o.kapur?`<div class="kv"><span>Kapur per kg silase</span><span>${nf(c.dose,1)} g</span></div>`:''}
      <p class="note">Ganti ke silase baru secara bertahap 3–5 hari bila ransum berubah. Jangan beri silase yang ditinggal terbuka semalam di palung; buang sisa sebelum pemberian pagi.</p>
    </div>
  </section>`;
}

/* ============ RENDER: MITIGASI ============ */
const LV={darurat:[0,'bad','Darurat'],tinggi:[1,'bad','Tinggi'],sedang:[2,'warn','Sedang'],info:[3,'info','Info']};
function buildAlerts(){
  const R=calc(S.opsi[S.aktif]),F=feedAll(R),P=palungRows(F),K=S.kondisi,act=F.filter(x=>x.aktif),N=act.length||1;
  const A=[],add=(lvl,judul,isi,aksi,src)=>A.push({lvl,judul,isi,aksi,src});
  const kontak=S.kontak?` (${esc(S.kontak)})`:'';
  /* kondisi hari ini */
  if(K.kembung>0)add('darurat',`${K.kembung} ekor kembung`,'Kembung bisa mematikan dalam beberapa jam.',['Berdirikan domba dengan kaki depan lebih tinggi, ajak berjalan, pijat perut kiri.','Kembung berbusa: minumkan minyak goreng ±50–100 ml pelan-pelan dengan botol.','Hentikan silase dan odot muda sampai pulih. Hubungi dokter hewan'+kontak+' segera; penusukan rumen hanya oleh petugas terlatih.'],'kondisi');
  if(K.lepuh>0)add('darurat',`${K.lepuh} ekor lepuh di mulut/kuku, air liur berlebih`,'Gejala mirip PMK, penyakit wajib lapor.',['Isolasi total, jangan ada domba masuk/keluar kandang.','Lapor Puskeswan/Dinas Peternakan Kab. Tasikmalaya hari ini.','Semprot desinfektan di pintu masuk; pekerja ganti alas kaki.'],'kondisi');
  if(K.tdkMakan>0)add('tinggi',`${K.tdkMakan} ekor tidak mau makan`,'Tanda awal paling umum dari demam, asidosis, kembung, atau batu kemih.',['Pisahkan, cek suhu tubuh (normal 38,5–39,5 °C), perut kiri, feses, dan cara kencing (jantan).','Beri odot segar dan air bersih; hentikan silase sementara bila feses encer berbau asam.','Bila tidak membaik dalam 12–24 jam, panggil dokter hewan'+kontak+'.'],'kondisi');
  if(K.diare>0)add(K.diare/N>=.1?'tinggi':'sedang',`${K.diare} ekor diare`,(K.diare/N>=.1?'Lebih dari 10% populasi; curigai sumber bersama (silase, air, odot basah) atau cacingan.':'Pantau agar tidak menyebar.'),['Cek kualitas silase yang sedang dipakai (tab Silase).','Odot dilayukan dulu; jangan ambil rumput dari lahan tergenang.','Berikan air bersih lebih banyak; konsultasikan obat cacing dengan petugas keswan.'],'kondisi');
  if(K.batuk>0)add(K.batuk/N>=.1?'tinggi':'sedang',`${K.batuk} ekor batuk/ingus`,'Risiko radang paru meningkat di musim hujan dan kandang lembap.',['Pisahkan yang batuk; cek napas cepat dan demam.','Tutup tirai saat hujan dan malam, tetapi sisakan celah ventilasi atas.','Antibiotik hanya atas resep dokter hewan.'],'kondisi');
  if(K.mata>0)add('sedang',`${K.mata} ekor mata berair/keruh`,'Kemungkinan pink eye (belekan), menular lewat lalat dan kontak.',['Pisahkan dan tempatkan di kandang teduh.','Kurangi debu dan lalat; bersihkan kotoran di sekitar mata dengan kain bersih.','Konsultasikan salep mata dengan dokter hewan.'],'kondisi');
  if(K.pincang>0)add(K.basah?'tinggi':'sedang',`${K.pincang} ekor pincang`,K.basah?'Lantai basah memperbesar risiko busuk kuku.':'Cek kuku dan sela kuku.',['Periksa sela kuku: bau busuk berarti busuk kuku.','Potong kuku yang panjang, bersihkan, keringkan lantai.','Bila banyak yang pincang sekaligus, curigai PMK atau asidosis.'],'kondisi');
  if(K.luka>0)add(K.musim==='hujan'?'tinggi':'sedang',`${K.luka} ekor luka terbuka`,'Luka dihinggapi lalat bisa berbelatung dalam 1–2 hari.',['Bersihkan luka setiap hari, keluarkan belatung bila ada.','Oleskan obat luka dan pengusir lalat.','Pisahkan agar tidak diganggu domba lain.'],'kondisi');
  if(K.bibir>0)add('sedang',`${K.bibir} ekor bintil/keropeng di bibir`,'Kemungkinan orf (dakangan). Bisa menular ke manusia.',['Pakai sarung tangan saat memegang.','Isolasi, bersihkan keropeng dengan antiseptik (povidone iodine).','Beri pakan lunak dan odot muda agar tetap makan.'],'kondisi');
  if(!K.airOk)add('tinggi','Air minum tidak selalu tersedia','Kurang minum menurunkan konsumsi pakan dan memicu batu saluran kemih pada jantan.',['Isi ulang tempat minum minimal 3× sehari dan bersihkan setiap pagi.','Kebutuhan kasar 3–5 liter/ekor/hari, lebih banyak saat panas.'],'kondisi');
  if(K.amonia)add('sedang','Bau amonia menyengat','Amonia merusak saluran napas dan mata.',['Bersihkan kolong/lantai, taburi kapur pertanian di bawah kandang panggung.','Buka ventilasi atas; kurangi kepadatan bila memungkinkan.'],'kondisi');
  if(K.basah)add('sedang','Lantai kandang basah','Pemicu busuk kuku, cacingan, dan radang paru.',['Perbaiki atap bocor dan talang.','Pastikan celah lantai panggung tidak tersumbat kotoran.'],'kondisi');
  const panas=K.suhu>=35||(K.suhu>=32&&K.rh>=80);
  if(panas||K.suhu>=33)add(panas&&K.suhu>=35?'tinggi':'sedang',`Panas ${K.suhu} °C, kelembapan ${K.rh}%`,'Domba mengurangi makan di siang yang panas.',['Geser sebagian odot ke sore (16:00) saat lebih sejuk.','Tambah tempat minum; semprot atap bila perlu.'],'kondisi');
  if(K.musim==='hujan')add('info','Musim hujan','Odot basah, kandang lembap, dan lalat meningkat.',['Layukan odot 2–4 jam sebelum diberikan.','Simpan wadah silase di tempat yang tidak kena hujan.','Cek luka dan sela kuku lebih sering.'],'kondisi');
  /* dari data domba & ransum */
  act.filter(x=>x.s.status==='Sakit').forEach(x=>{
    const row=P.find(p=>p.id===x.pal),oth=row?row.mem.filter(y=>y!==x):[];
    add('tinggi',`${x.s.tag} berstatus Sakit di ${x.s.posisi}`,oth.length?`Berbagi palung ${row.id} dengan ${oth.map(y=>y.s.tag).join(', ')}. Penyakit menular bisa menyebar lewat palung dan air minum.`:'Pantau nafsu makan dan suhu tubuh.',['Pindahkan ke Kandang Karantina dengan palung dan tempat minum sendiri.','Beri pakan domba sakit paling akhir, cuci tangan dan alat sesudahnya.','Catat gejala dan hubungi dokter hewan'+kontak+'.'],'data');
  });
  const byPos={};act.forEach(x=>{(byPos[x.s.posisi]=byPos[x.s.posisi]||[]).push(x)});
  Object.entries(byPos).forEach(([pos,list])=>{const j=new Set(list.map(x=>x.s.jenis));if(j.size>1){const minor=list.filter(x=>x.s.jenis==='Jantan');add('sedang',`Jantan dan betina satu kandang di ${pos}`,`${list.map(x=>x.s.tag+' ('+x.s.jenis+')').join(', ')}.`,[`Pindahkan ${minor.map(x=>x.s.tag).join(', ')} ke kandang jantan untuk mencegah perkawinan tidak terencana dan rebutan pakan.`],'data')}});
  P.filter(p=>p.n>1&&p.range>S.jadwal.batas).forEach(p=>{const lt=p.mem.slice().sort((a,b)=>a.s.bobot-b.s.bobot)[0];add('sedang',`Selisih bobot ${nf(p.range,1)} kg di palung ${p.id}`,`Domba besar mendominasi palung; yang kecil (${lt.s.tag}, ${nf(lt.s.bobot,1)} kg) kemungkinan kebagian lebih sedikit dari hitungan.`,[`Pindahkan ${lt.s.tag} ke kandang dengan bobot setara, atau beri porsinya terpisah.`],'data')});

  const maxCa=Math.max(...R.months.map(x=>x.caPct));if(maxCa>S.t.batasCa)add('sedang',`Ca ransum ${pc(maxCa,2)} dari BK, di atas batas aman ${pc(S.t.batasCa,1)}`,'Kalsium berlebih menekan penyerapan P dan Zn.',['Turunkan target Ca:P atau kurangi kapur.'],'ransum');

  const minOd=Math.min(...R.months.map(x=>x.odShare));if(minOd<.5)add('sedang',`Hijauan hanya ${pc(minOd,0)} dari BK ransum`,'Hijauan di bawah 50% BK menaikkan risiko asidosis dan kembung.',['Tambah odot atau kurangi silase/konsentrat.'],'ransum');

  return A.sort((a,b)=>LV[a.lvl][0]-LV[b.lvl][0]);
}

  }else if(CT.sk==='beli'){

function saveS(){
  if(!GAS){toast('Mode pratinjau: data tidak disimpan');return}
  const N=NM();let d;
  if(CT.sk==='silase'){const oi=CT.sb.opsi<0?S.aktif:CT.sb.opsi,o=S.opsi[oi];
    const bahan=[{jenis:N.ampas,kg:+CT.sb.ampas||0}].concat([N.kons,N.mol].concat(o.kapur?[N.kapur,N.prob]:[]).map(n=>({jenis:n,kg:+CT.sb.v[n]||0}))).filter(b=>b.kg>0);
    d={tipe:'silase',tanggal:CT.kTgl,bahan,hasil:+CT.sb.v.hasil||0,ket:o.nama,paksa:!!CT.sb.paksa}}
  else if(CT.sk==='pakai'){const h=+CT.pk.hari||1,W=odW(),lbl=h>1?`Pakan harian (${h} hari, app)`:'Pakan harian (app)',items=[];
    Object.entries(CT.pk.v).filter(([n,v])=>+v>0).forEach(([n,v])=>{v=+v;
      if(n===N.odot&&W<1){items.push({jenis:n,kg:r1(v),ket:lbl+' – diberikan (layu)'});const s=r1(v/W-v);if(s>0)items.push({jenis:n,kg:s,ket:`Susut pelayuan odot ${Math.round((1-W)*100)}%`})}
      else items.push({jenis:n,kg:v,ket:lbl})});
    d={tipe:'pakai',tanggal:CT.kTgl,paksa:!!CT.pk.paksa,items};if(!d.items.length){toast('Isi jumlah yang dipakai');return}}
  else if(CT.sk==='beli')d={tipe:'beli',tanggal:CT.kTgl,items:[{jenis:CT.bl.jenis,kg:+CT.bl.kg,harga:+CT.bl.harga||'',ket:CT.bl.ket}]};
  else d={tipe:'koreksi',tanggal:CT.kTgl,jenis:CT.kr.jenis,fisik:+CT.kr.fisik,ket:CT.kr.ket};
  CT.busyS=true;render();
  run().withSuccessHandler(r=>{CT.busyS=false;
    CT.log.unshift({t:{silase:'Buat silase',pakai:'Pemakaian',beli:'Masuk',koreksi:'Koreksi'}[CT.sk],tag:CT.sk==='silase'?N.sil:CT.sk==='beli'?CT.bl.jenis:CT.sk==='koreksi'?CT.kr.jenis:'Pakan',d:CT.sk==='silase'?'+'+nf(d.hasil,0)+' kg':'',tgl:fdS(pd(CT.kTgl))});
    if(CT.sk==='silase')CT.sb={opsi:-1,ampas:'',v:{},paksa:false,ket:''};else if(CT.sk==='pakai')CT.pk={hari:1,v:{},paksa:false,ket:''};else if(CT.sk==='beli')CT.bl={jenis:'',kg:'',harga:'',ket:''};else CT.kr={jenis:'',fisik:'',ket:''};
    toast(r&&r.pesan||'Tersimpan');render();setTimeout(loadData,800)})
  .withFailureHandler(e=>{CT.busyS=false;render();toast('Gagal: '+(e&&e.message||e))}).simpanStok(d);

function anPengawasan(D,X){
  const t0=today0(),iso=todayISO(),L=S.kondisiLog||[],J=S.jadwal,list=[],jual=[];
  const F=feedAll(D.R),P=palungRows(F);
  S.domba.filter(isAktif).forEach(s=>{

    if(ev.length&&s.status!=='Sakit'){why.push(['warn','Sakit '+ev.map(e=>e.ket||'').filter(Boolean).join(', ')+' ('+fdS(pd(ev[ev.length-1].tgl))+')']);skor+=2}

      else if(r.kat==='rendah'){why.push(['bad',`ADG ${nf(r.adg,0)} g/hari`]);skor+=4}
      else if(r.kat==='kurang'){why.push(['warn',`ADG ${nf(r.adg,0)} g/hari`]);skor+=2}
      else if(r.kat==='cek'){why.push(['info','Data timbang janggal']);skor+=2}}

  }else{

    else{
      const k=keys.includes(AN.batch)?AN.batch:keys[0],G=groups[k],std=S.g.bbAwal,t0=today0(),L=S.kondisiLog||[];
      const umur=days(pd(k),t0),bw=G.map(s=>s.bAwal),avg=bw.reduce((a,b)=>a+b,0)/bw.length;
      const info=G.map(s=>{const sr=D.ser(s.tag).filter(x=>!x.awal);const f1=sr[0];const adg1=f1?(f1.kg-s.bAwal)/Math.max(1,days(pd(s.masuk),pd(f1.tgl)))*1000:null;
        const ev=L.filter(e=>e.tag===s.tag&&days(pd(s.masuk),pd(e.tgl))<=21&&e.status);
        const kelas=s.bAwal<std*.85?['warn','Kecil']:s.bAwal>std*1.1?['info','Besar']:['ok','Standar'];
        const adgP=adg1!=null&&adg1>0&&adg1<ADG_MAX?adg1:D.tgt;const sisa=Math.max(0,S.g.bbPanen-s.bobot);const hari=Math.ceil(sisa/(adgP/1000));
        return {s,adg1,f1,ev,kelas,hari,est:isAktif(s)&&sisa>0?addD(t0,hari):null}});

      if(sakit)sar.push(`${sakit} dari ${G.length} ekor sakit/mati dalam 3 minggu pertama (${pc(sakit/G.length,0)}). ${sakit/G.length>=.2?'Angka ini tinggi; evaluasi kondisi saat pembelian dan perjalanan, atau pertimbangkan ganti pemasok.':'Pantau terus sampai lewat masa adaptasi.'}`);
      const blm=info.filter(x=>!x.f1&&isAktif(x.s)&&umur>30);if(blm.length)sar.push(`${blm.map(x=>x.s.tag).join(', ')} belum pernah ditimbang sejak masuk ${umur} hari lalu, jadi porsi pakannya masih dihitung dari bobot masuk. Timbang minggu ini.`);
      if(adgAvg!=null)sar.push(`ADG bulan pertama rata-rata ${nf(adgAvg,0)} g/hari (${adgAvg>=D.tgt?'sudah sesuai target':'di bawah target; wajar bila masih adaptasi, tapi cek lagi di timbangan berikutnya'}).`);
      else sar.push('Belum ada timbangan setelah masuk. Timbang ulang 2–4 minggu setelah masuk untuk melihat adaptasi.');
      const bandingStd=avg<std?`rata-rata ${nf(std-avg,1)} kg di bawah`:`rata-rata ${nf(avg-std,1)} kg di atas`;
      body=`<section class="blk">
        <h2>Analisis domba baru masuk</h2>
        <p class="lead">Dikelompokkan per tanggal masuk. Bobot awal dibandingkan dengan standar bobot awal ${nf(std,1)} kg di Kalkulator; kondisi diambil dari QDF › Input_Kondisi 3 minggu pertama.</p>
        <div class="kchips" style="margin-bottom:14px">${keys.map(x=>`<button data-act="anBatch" data-v="${x}" aria-pressed="${x===k}">${fd(pd(x))} <span>${groups[x].length}</span></button>`).join('')}</div>

          <div class="kpi"><div class="lbl">Ekor</div><div class="v">${G.length}</div><div class="s">${G.filter(s=>s.jenis==='Jantan').length} jantan · ${G.filter(s=>s.jenis==='Betina').length} betina · ${umur} hari lalu</div></div>
          <div class="kpi"><div class="lbl">Bobot awal rata-rata</div><div class="v">${nf(avg,1)} kg</div><div class="s">${nf(Math.min(...bw),1)}–${nf(Math.max(...bw),1)} kg · ${bandingStd} standar</div></div>

          <div class="kpi"><div class="lbl">ADG bulan pertama</div><div class="v">${adgAvg!=null?nf(adgAvg,0)+' g':'—'}</div><div class="s">target ${nf(D.tgt,0)} g/hari</div></div>
        </div>
      </section>
      <section class="blk"><h3>Penanganan</h3><div class="panel"><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${sar.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>
      <section class="blk"><h3>Per ekor</h3><div class="elist">${info.map(x=>`<div class="er"><div><span class="tg">${esc(x.s.tag)}</span> <span class="sub">${esc(x.s.jenis)} · ${esc(x.s.posisi)} · ${esc(x.s.status)}</span>

        ${x.est?`<div class="sub">Perkiraan capai ${S.g.bbPanen} kg: <b>${fd(x.est)}</b> (${x.hari} hari lagi)</div>`:''}</div>
        <div class="amt">${x.adg1!=null&&x.adg1<ADG_MAX?nf(x.adg1,0)+' g':x.adg1!=null?'cek data':'—'}<div class="sub">ADG awal</div></div></div>`).join('')}</div></section>`;
    }
  }
  return `${syncBanner()}${sub}${body}`;
}

function run(){let ok=null,fail=null;const p=new Proxy({},{get(_,k){
  if(k==='withSuccessHandler')return f=>{ok=f;return p};
  if(k==='withFailureHandler')return f=>{fail=f;return p};
  return (...args)=>{
    const ap=O.getApp();let pr;
    if(FN[k])pr=O.api(FN[k],ap.pin,...args);
    else if(SIMPAN[k])pr=O.api('wa_simpan',ap.pin,SIMPAN[k],args[0],uid());

    else{fail&&fail(new Error('Fungsi tidak dikenal: '+String(k)));return}
    pr.then(r=>{
      if(r&&r.pinSalah){O.logout('Sesi berakhir: akun atau kata sandi berubah. Masuk lagi.');return}
      if(r&&r.ok===false){fail&&fail(new Error(r.error||'Gagal'));return}
      if(k==='daftarLaporan'){ok&&ok(r.daftar||[]);return}

function applyRows(sheets){

  const G={...S.g};put(G,'bbAwal',/^Bobot awal/i);put(G,'bbPanen',/^Bobot panen/i);put(G,'hari',/^Lama penggemukan/i);put(G,'anggaran',/^Anggaran pakan/i);put(G,'mol',/^Molases dalam/i);put(G,'meM',/^ME pemeliharaan/i);put(G,'meG',/^ME untuk 1 kg/i);put(G,'mcal',/^Mcal ME per kg TDN/i);

    const r=find(IN,re);if(!r)return;const x=B[k];

  const T={...S.t};put(T,'caP',/^Target rasio Ca/i);put(T,'kadarCa',/^Kadar Ca kapur/i);put(T,'hKapur',/^Harga kapur/i);put(T,'batasCa',/^Batas aman Ca/i);put(T,'hProb',/^Harga probiotik/i);put(T,'dosisProb',/^Dosis probiotik/i);
  const O=JSON.parse(JSON.stringify(S.opsi));

    const t=R[0]&&typeof R[0][0]==='string'?R[0][0].match(/^OPSI\s*(\d)\s*[–-]\s*([^(]+)/i):null;if(t)o.nama='Opsi '+t[1]+' · '+t[2].trim();
    const r=nv(find(R,/^Rasio ampas/i));if(r!=null)o.r=r;
    let pk=nv(find(R,/^Protein konsentrat/i));if(pk!=null){pk=pk<1?Math.round(pk*100):Math.round(pk);if([14,16,18,20].includes(pk))o.pk=pk}
    [['sil',/^Silase fermentasi$/i],['od',/^Rumput Odot segar/i],['kt',/^Konsentrat tambahan/i]].forEach(([k,re])=>{const row=find(R,re);if(row)for(let m=0;m<6;m++){const v=nv(row,m+1);o[k][m]=v!=null?v:0}});
  });
  const dom=mapSheep(rows('Data_Domba')||rows('Data_Domba_QDF')||[]);
  if(!dom.length)throw new Error('Data domba kosong. Cek sheet Data_Domba di QDF.');
  const PP=rows('Peta_Palung');let pal=null;
  if(PP){const h=PP.findIndex(r=>r&&/^ID Palung/i.test(String(r[0]||'')));if(h>=0)pal=PP.slice(h+1).filter(r=>r&&/^P-/.test(String(r[0]||'').trim())).map(r=>[String(r[0]).trim(),String(r[1]||'').trim(),String(r[2]||'').trim()])}
  const J={...S.jadwal},PL=rows('Pakan_Palung');put(J,'silPagi',/^Porsi silase pagi/i,2,PL);put(J,'odPagi',/^Porsi odot/i,2,PL);put(J,'batas',/^Batas selisih bobot/i,2,PL);{const r=find(PL,/^Susut pelayuan odot/i),v=r&&typeof r[2]==='number'?r[2]:null;if(v!=null){const s=v>1?v/100:v;J.layu=s;J.pakaiLayu=s>0;J.layuSheet=s}else J.layuSheet=null}

function svgLine(series,o={}){
  const all=series.flatMap(s=>s.pts);if(!all.length)return '<p class="muted small">Belum ada data.</p>';
  const W=Math.round(Math.max(300,Math.min(680,(o.w||MAIN().clientWidth)-30))),H=o.h||210,L=42,R=14,T=14,B=28;
  const xs=all.map(p=>p.x),ys=all.map(p=>p.y).concat(o.extraY||[]);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  let y0=o.y0!=null?o.y0:Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.12||1;y0=o.y0!=null?o.y0:Math.floor(y0-pad);y1=Math.ceil(y1+pad);
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const step=niceStep((y1-y0)/4),ticks=[];for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step)ticks.push(v);
  const months=[];{const d=new Date(x0);d.setDate(1);d.setMonth(d.getMonth()+1);while(d.getTime()<=x1){months.push(d.getTime());d.setMonth(d.getMonth()+1)}}
  const id=o.id||'g';
  return `<svg class="ichart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Grafik')}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${nf(v,step<1?1:0)}</text>`).join('')}

function petaData(){
  const R=calc(S.opsi[S.aktif]),F=feedAll(R),P=palungRows(F),W=odW();
  let an=null;try{const D=anBase();if(D.months.length){const X=anSesi(D,D.months[D.months.length-1]);an={D,X}}}catch(e){}
  const k2={};
  const info=k=>{if(k2[k])return k2[k];const mem=F.filter(x=>x.aktif&&x.s.posisi===k);const w=mem.map(x=>x.s.bobot);
    const adgs=an?mem.map(x=>{const r=an.X.rows.find(r=>r.tag===x.s.tag);return r&&r.adg!=null&&r.kat!=='cek'?r.adg:null}).filter(v=>v!=null):[];
    return k2[k]={k,mem,n:mem.length,j:mem.filter(x=>x.s.jenis==='Jantan').length,b:mem.filter(x=>x.s.jenis==='Betina').length,sakit:mem.some(x=>x.s.status==='Sakit'),avg:w.length?w.reduce((a,b)=>a+b,0)/w.length:0,range:w.length>1?Math.max(...w)-Math.min(...w):0,adg:adgs.length?adgs.reduce((a,b)=>a+b,0)/adgs.length:null,jual:mem.filter(x=>x.s.bobot>=S.g.bbPanen).length}};
  const groups={};
  P.forEach(p=>{const g=/^[A-Z]\d+$/i.test(p.k1)?'Blok '+p.k1[0].toUpperCase():'Kandang lain';(groups[g]=groups[g]||[]).push({p,a:info(p.k1),b:p.k2?info(p.k2):null})});
  const kosongTapiIsi=F.filter(x=>x.aktif&&!x.pal);
  return {groups,info,P,an,W,R,lost:kosongTapiIsi};
}
function cellColor(c,mode,D){
  if(!c.n)return 'var(--sunk)';
  if(mode==='bobot'){const t=Math.min(1,Math.max(0,(c.avg-S.g.bbAwal)/(S.g.bbPanen-S.g.bbAwal)));return `color-mix(in srgb, var(--accent) ${Math.round(20+t*70)}%, var(--surface))`}
  if(mode==='adg'){if(c.adg==null)return 'var(--tint)';const r=c.adg/(D&&D.an?D.an.D.tgt:111);return r>=1.1?'color-mix(in srgb, var(--ok) 55%, var(--surface))':r>=.9?'color-mix(in srgb, var(--ok) 28%, var(--surface))':r>=.6?'color-mix(in srgb, var(--warn) 40%, var(--surface))':'color-mix(in srgb, var(--bad) 40%, var(--surface))'}
  return `color-mix(in srgb, var(--accent) ${Math.min(80,18+c.n*14)}%, var(--surface))`;
}
function rCell(c,mode,D){
  const dark=c.n&&((mode==='ekor'&&c.n>=4)||(mode==='bobot'&&(c.avg-S.g.bbAwal)/(S.g.bbPanen-S.g.bbAwal)>.55));

  return `<button class="kcell ${c.sakit?'sick':''} ${dark?'dark':''}" style="background:${cellColor(c,mode,D)}" data-act="kandang" data-v="${esc(c.k)}" aria-label="Kandang ${esc(c.k)}, ${c.n} ekor">

}

function pindahkan(){

  if(!GAS){toast('Mode pratinjau: tidak tersimpan');return}

  const F=feedAll(R).find(x=>x.s.tag===tag),W=odW();
  const ev=(S.kondisiLog||[]).filter(e=>e.tag===tag);
  const first=sr[0],last=sr[sr.length-1],hari=first?days(pd(first.tgl),pd(last.tgl)):0,adgAll=hari>0?(last.kg-first.kg)/hari*1000:null;
  const pairs=[];for(let i=1;i<sr.length;i++){const a=sr[i-1],b=sr[i],d=days(pd(a.tgl),pd(b.tgl));if(d>0)pairs.push({a,b,d,adg:(b.kg-a.kg)/d*1000})}

  const sisa=Math.max(0,S.g.bbPanen-s.bobot),hariLagi=sisa>0?Math.ceil(sisa/(okAdg/1000)):0,est=addD(t0,hariLagi);

  const pts=sr.map((p,i)=>{const pr=i?sr[i-1]:null,d=pr?days(pd(pr.tgl),pd(p.tgl)):0;return {x:pd(p.tgl).getTime(),y:p.kg,label:nf(p.kg,1)+' kg',note:p.awal?'bobot masuk':pr&&d>0?((p.kg-pr.kg)>=0?'+':'')+nf(p.kg-pr.kg,1)+' kg, '+nf((p.kg-pr.kg)/d*1000,0)+' g/hari'+(p.cat?' · '+p.cat:''):p.cat}});
  const tgtLine=first?[{x:pd(first.tgl).getTime(),y:first.kg},{x:Math.max(t0.getTime(),pd(last.tgl).getTime()),y:first.kg+tgt/1000*days(pd(first.tgl),new Date(Math.max(t0.getTime(),pd(last.tgl).getTime())))}]:[];
  const proj=s.status==='Sehat'||s.status==='Sakit'?(sisa>0?[{x:pd(last.tgl).getTime(),y:last.kg},{x:est.getTime(),y:S.g.bbPanen,label:S.g.bbPanen+' kg',note:'perkiraan capai bobot panen'}]:[]):[];
  const timeline=[...sr.map(p=>({tgl:p.tgl,t:p.awal?'Masuk':'Timbang',d:p.awal?`${nf(p.kg,1)} kg · ${esc(s.kAwal||'')}`:`${nf(p.kg,1)} kg${p.cat?' · '+esc(p.cat):''}`,c:p.awal?'info':'ok'})),...ev.map(e=>({tgl:e.tgl,t:e.status||'Pindah',d:[e.ket,e.pindah?'→ '+e.pindah:'',e.harga?rp(e.harga):''].filter(Boolean).map(esc).join(' · '),c:e.status==='Sakit'||e.status==='Mati'?'bad':e.status==='Terjual'?'hay':'info'}))].sort((a,b)=>b.tgl.localeCompare(a.tgl));
  const biaya=F&&F.aktif?F.cost:null;
  return `<div class="eyebrow">${esc(s.jenis)} · ${esc(s.pemilik)}</div>
  <div class="row" style="align-items:baseline;gap:10px"><h2 style="margin:2px 0 4px">${esc(tag)}</h2>${chip(s.status==='Sehat'?'ok':s.status==='Sakit'?'bad':'',esc(s.status))}${s.bobot>=S.g.bbPanen&&isAktif(s)?chip('hay','Siap jual'):''}</div>
  <p class="small muted" style="margin:0 0 12px">Kandang ${esc(s.posisi)}${umur!=null?' · '+umur+' hari di Qurbandong':''}${s.timbang?' · ditimbang '+fdS(pd(s.timbang)):''}</p>
  <div class="kpis">
    <div class="kpi"><div class="lbl">Bobot</div><div class="v">${nf(s.bobot,1)}<small> kg</small></div><div class="s">masuk ${nf(s.bAwal,1)} kg · +${nf(s.bobot-s.bAwal,1)}</div></div>
    <div class="kpi"><div class="lbl">ADG terakhir</div><div class="v" style="color:var(--${lastAdg==null?'ink':lastAdg>=tgt?'ok':lastAdg>=tgt*.6?'warn':'bad'})">${lastAdg!=null?nf(lastAdg,0):'—'}<small> g</small></div><div class="s">rata-rata sejak masuk ${adgAll!=null?nf(adgAll,0)+' g':'—'}</div></div>
    <div class="kpi"><div class="lbl">Capai ${S.g.bbPanen} kg</div><div class="v" style="font-size:20px">${!isAktif(s)?'—':sisa<=0?'Sudah':fdS(est)}</div><div class="s">${isAktif(s)&&sisa>0?hariLagi+' hari lagi pada '+nf(okAdg,0)+' g/hari':''}</div></div>
    <div class="kpi"><div class="lbl">Pakan hari ini</div><div class="v" style="font-size:20px">${F&&F.aktif?nf(F.sil,2)+' / '+nf(F.od*W,2):'—'}</div><div class="s">${F&&F.aktif?'kg silase / odot · '+rp(biaya):''}</div></div>
  </div>
  <div class="panel" style="margin-top:12px"><h3 style="margin-bottom:4px">Grafik bobot</h3>
    ${svgLine([{name:'Bobot aktual',color:'var(--accent)',pts},{name:'Jalur target '+nf(tgt,0)+' g/hari',color:'var(--orange)',dash:true,dots:false,w:1.6,pts:tgtLine},{name:'Perkiraan',color:'var(--muted)',dash:true,w:1.5,pts:proj}],{id:'pf',h:220,w:Math.min(720,window.innerWidth)-40,label:'Grafik bobot '+tag})}
  </div>
  <div class="row" style="margin:12px 0"><button class="btn orange" data-act="profTimbang" data-v="${esc(tag)}">Catat timbang</button><button class="btn ghost" data-act="profKondisi" data-v="${esc(tag)}">Catat kondisi / pindah</button><button class="btn ghost" data-act="kandang" data-v="${esc(s.posisi)}">Lihat kandang ${esc(s.posisi)}</button></div>
  <h3>Riwayat</h3>
